function bucketRow(label,b){
 if(!b||!n(b.median))return`<tr><td>${label}</td><td colspan="3" class="ev-none">nothing found</td></tr>`;
 const basis=b.method==="sales"
  ? (b.n===1?"1 sale":b.n+" sales")
  : b.method==="guide"
   ? `<span class="ev-guide">${esc((b.guides&&b.guides[0]&&b.guides[0].source)||"market guide")}</span>`
   : `<span class="ev-est">estimate</span>`;
 return`<tr><td>${label}</td>
  <td class="ev-med${b.method==="estimate"?" ev-soft":""}">${money(b.median)}</td>
  <td>${basis}</td>
  <td>${b.low===b.high?"":money(b.low)+"–"+money(b.high)}</td></tr>`;
}
function lookupLinks(c){
 const q=[c.year,c.set,c.subject,c.num?"#"+c.num:"",c.variant].filter(Boolean).join(" ");
 if(!q.trim())return"";
 const e=encodeURIComponent(q);
 // matches the pricing function: sports go to SportsCardsPro, everything else to PriceCharting
 const tcg=["NBA","WNBA","NFL","MLB","NHL","Soccer","Boxing/MMA"].indexOf(c.cat)===-1;
 const links=[
  ["eBay sold","https://www.ebay.com/sch/i.html?_nkw="+e+"&LH_Sold=1&LH_Complete=1"],
  [tcg?"PriceCharting":"SportsCardsPro",
   tcg?"https://www.pricecharting.com/search-products?type=prices&q="+e
      :"https://www.sportscardspro.com/search-products?q="+e],
  ["PSA prices","https://www.psacard.com/auctionprices"],
  ...(c.graded&&c.cert&&String(c.grader).toUpperCase()==="PSA"
   ?[["Verify cert","https://www.psacard.com/cert/"+encodeURIComponent(String(c.cert).replace(/\D/g,""))]]:[]),
  ["Google","https://www.google.com/search?q="+e],
 ];
 return`<div class="lookup">
  <div class="lookup-hd">Check it yourself</div>
  <div class="lookup-row">${links.map(([t,u])=>
   `<a class="lookup-a" href="${u}" target="_blank" rel="noopener">${t}</a>`).join("")}</div>
  <p class="lookup-q">Searching: <code>${esc(q)}</code></p>
 </div>`;
}
function evidencePanel(c){
 const ev=c.evidence;
 if(ev&&ev.error)return`<div class="ev"><div class="ev-hd">Pricing failed<span class="ev-when">${esc(ev.checkedOn||"")}</span></div>
  <div class="ev-warn">${esc(ev.error)}</div>
  <p class="note" style="margin:8px 0 0">Try the button above again, or use the lookup links below to price it by hand.</p></div>`;
 if(!ev)return`<div class="ev ev-empty">No pricing evidence yet. Tap the button above and it will record the individual sales it finds.</div>`;
 const list=[];

const FULLCOLS=["sku","cat","year","set","subject","num","variant","serial","qty","graded","grader","grade",
 "cert","conf","cost","acqDate","source","vRaw","v9","v10","pricedOn","status","listPrice","salePrice",
 "saleDate","salePlatform","loc","photoF","photoB","notes"];
function csvEsc(v){const s=String(v==null?"":v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function exportCSV(kind){
 const cols=kind==="list"?["sku","title","price","qty","photo_front","photo_back","category","condition","collection","traits"]:FULLCOLS;
 const rows=S.cards.map(c=>kind==="list"
  ?[c.sku,title(c),n(c.listPrice)||n(c.vRaw),c.qty,photoURL(c,"F"),photoURL(c,"B"),c.cat,c.graded?c.grader+" "+c.grade:"Ungraded",S.settings.nickname||"",traitList(c).join(" ")]
  :cols.map(k=>k==="photoF"?photoURL(c,"F"):k==="photoB"?photoURL(c,"B"):c[k]));
 const csv=[cols.join(","),...rows.map(r=>r.map(csvEsc).join(","))].join("\n");
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
 a.download=`the-slab-${kind}-${new Date().toISOString().slice(0,10)}.csv`;a.click();
 toast(`Exported ${S.cards.length} rows`);
}
function splitRow(line){const out=[];let cur="",q=false;
 for(let i=0;i<line.length;i++){const ch=line[i];
  if(q){if(ch==='"'&&line[i+1]==='"'){cur+='"';i++;}else if(ch==='"')q=false;else cur+=ch;}
  else if(ch==='"')q=true;else if(ch===","){out.push(cur);cur="";}else cur+=ch;}
 out.push(cur);return out;}
function importCSV(text){
 const lines=text.split(/\r?\n/).filter(l=>l.trim());
 const head=splitRow(lines[0]).map(s=>s.trim());
 const added=lines.slice(1).map(ln=>{const vals=splitRow(ln),o=blank("");
  head.forEach((k,i)=>{if(k in o)o[k]=k==="graded"?/true|yes|1/i.test(vals[i]||""):(vals[i]||"");});
  o.id="i"+Date.now()+Math.random().toString(36).slice(2,6);return o;})
  .filter(c=>c.subject||c.sku);
 S.cards=[...added,...S.cards];pushMany(added);render();toast(`Imported ${added.length} cards`);
}

function toast(msg){
 const d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);
 setTimeout(()=>d.remove(),2600);
}
let skuReserve={};
function takenSkus(){
 const t={};
 S.cards.forEach(c=>{if(c.sku)t[String(c.sku).trim().toUpperCase()]=1;});
 Object.keys(skuReserve).forEach(k=>{t[k]=1;});
 return t;
}
function nextSku(reserve){
 const taken=takenSkus();
 const ns=Object.keys(taken).map(k=>parseInt(k.replace(/\D/g,""),10)).filter(x=>!isNaN(x));
 let i=(ns.length?Math.max(...ns):0)+1;
 let sku="C-"+String(i).padStart(4,"0");
 while(taken[sku]){i++;sku="C-"+String(i).padStart(4,"0");}   // never hand out a number twice
 if(reserve)skuReserve[sku]=1;
 return sku;
}
function releaseSku(sku){delete skuReserve[String(sku||"").trim().toUpperCase()];}
function bumpSku(sku){const m=String(sku).match(/^(.*?)(\d+)$/);
 return m?m[1]+String(parseInt(m[2],10)+1).padStart(m[2].length,"0"):"";}

    out.push("free missed : "+(r.directWhy||"(nothing reported)"));
    const ev=r.evidence||null;
    out.push("evidence?   : "+(ev?"yes":"NO - this is the problem"));
    if(ev){
     out.push("current med : "+JSON.stringify(ev.current&&ev.current.median));
     const gotIt=ev.current&&n(ev.current.median)>0;
     out.push("passes gate : "+(gotIt?"yes":"NO - value not applied"));
     if(gotIt){
      target.vRaw=n(r.vRaw);target.evidence=ev;
      target.pricedOn=new Date().toISOString().slice(0,10);
      save();
      out.push("vRaw after  : "+JSON.stringify(target.vRaw));
      try{await pushCard(target);out.push("saved to db : ok");}
      catch(e2){out.push("saved to db : FAILED - "+(e2.message||e2));}
      out.push("still pending after save: "+(pending[target.id]?"YES - write rejected":"no"));
     }
    }
   }catch(e){
    out.push("THREW after "+Math.round((Date.now()-t0)/1000)+"s");
    out.push(String(e&&e.message||e));
   }
   window._diag=out.join("\n");render();break;}
  case"pricetest":{
   window._diag="running a real price lookup…";render();
   const probe={year:"1990",set:"Fleer",subject:"Michael Jordan",num:"26",variant:"",
    serial:"",cat:"NBA",graded:false,grader:"PSA",grade:""};
   const out=["price lookup test","card: 1990 Fleer Michael Jordan #26 (raw)",""];
   const t0=Date.now();
   try{
    const r=await edgeCall("reprice",{card:probe},140000);
    out.push("took        : "+Math.round((Date.now()-t0)/1000)+"s");
    out.push("vRaw        : "+JSON.stringify(r.vRaw));
    out.push("v9 / v10    : "+JSON.stringify(r.v9)+" / "+JSON.stringify(r.v10));
    out.push("confidence  : "+(r.confidence||"-"));
    out.push("totalComps  : "+(r.totalComps===undefined?"(field missing)":r.totalComps));
    out.push("methods     : "+(r.methods?JSON.stringify(r.methods):"(field missing - old function)"));
    out.push("note        : "+(r.note||"(none)"));
    out.push("");
    out.push("raw reply:");
    out.push(JSON.stringify(r).slice(0,1400));
   }catch(e){
    out.push("FAILED after "+Math.round((Date.now()-t0)/1000)+"s");
    out.push(String(e.message||e));
   }
   window._diag=out.join("\n");render();break;}
  case"diag":{
   window._diag="running…";render();
   const out=[];
   out.push("app build   : "+VERSION);
   out.push("signed in   : "+(user?user.email:"NO"));
   out.push("token held  : "+(authToken?"yes":"no — using anon key"));
   out.push("project     : "+(cfg?cfg.url:"none"));
   out.push("cards local : "+S.cards.length);
   try{const srv=await rest("/rest/v1/cards?select=id",{method:"GET",headers:restHeaders()},15000,"count");
    out.push("cards server: "+((srv&&srv.length)||0));
   }catch(e){out.push("cards server: FAILED - "+(e.message||e));}
   out.push("unsaved     : "+Object.keys(pending).length);
   for(const fn of ["scan","reprice"]){
    const t0=Date.now();
    try{
     const r=await edgeCall(fn,{ping:true},15000);
     const ms=Date.now()-t0;
     out.push("");
     out.push(fn+" reachable : yes ("+ms+"ms)");
     out.push(fn+" deployed  : "+(r.fnVersion||"UNKNOWN — old code"));
     out.push(fn+" api key   : "+(r.hasApiKey?"present":"MISSING"));
     out.push(fn+" websearch : "+(r.searchEnabled?"on":"off"));
    }catch(e){
     out.push("");
     out.push(fn+" reachable : NO ("+(Date.now()-t0)+"ms)");
     out.push(fn+" error     : "+(e.message||e));
    }
   }
   out.push("");
   try{const t0=Date.now();
    await rest("/rest/v1/cards?select=id&limit=1",{method:"GET",headers:restHeaders()},15000,"read");
    out.push("db read     : ok ("+(Date.now()-t0)+"ms)");
   }catch(e){out.push("db read     : FAILED - "+(e.message||e));}
   try{const t0=Date.now();
    await rest("/rest/v1/cards",{method:"POST",
     headers:restHeaders({"Prefer":"resolution=merge-duplicates,return=minimal"}),
     body:JSON.stringify([{id:"diag-probe",user_id:user?user.id:null,sku:"DIAG",
      subject:"connection test",updated_at:new Date().toISOString()}])},15000,"write");
    out.push("db write    : ok ("+(Date.now()-t0)+"ms)");
    await rest("/rest/v1/cards?id=eq.diag-probe",{method:"DELETE",
     headers:restHeaders({"Prefer":"return=minimal"})},15000,"cleanup");
    out.push("db cleanup  : ok");
   }catch(e){out.push("db write    : FAILED - "+(e.message||e));}
   window._diag=out.join("\n");render();break;}
  case"hardrefresh":{
   toast("Clearing…");
   try{if("serviceWorker"in navigator){
     const rs=await navigator.serviceWorker.getRegistrations();
     for(const r of rs)await r.unregister();}
    if(window.caches){const ks=await caches.keys();for(const k of ks)await caches.delete(k);}
   }catch(_){}
   location.reload();break;}
  case"seed":{const have=S.cards.map(c=>c.sku);
   const add=seed().filter(c=>have.indexOf(c.sku)===-1);
   if(!add.length){toast("They're already here");break;}
   S.cards=add.concat(S.cards);pushMany(add);render();toast(`Added ${add.length} cards`);break;}
  case"repriceone":if(editing){commit();
   queueReprice([S.cards.find(c=>c.id===editing.id)],true);editing=null;render();}break;
  case"repriceview":{const set=(window._visible||[]).filter(c=>c.subject||c.set);
   if(confirmSpend(set.length))queueReprice(set);break;}
  case"repricestale":{const set=S.cards.filter(isStale);
   if(confirmSpend(set.length))queueReprice(set);break;}
  case"priceunpriced":{const set=S.cards.filter(c=>c.status!=="sold"&&!n(c.vRaw)&&(c.subject||c.set));
   if(confirmSpend(set.length))queueReprice(set);break;}
  case"stopreprice":rq=[];toast("Stopping — finishing in-flight cards");render();break;
  case"exp-full":exportCSV("full");break;
  case"exp-list":exportCSV("list");break;
  case"imp":document.getElementById("csvin").click();break;
  case"install":
   if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;}
   else toast("On iPhone: tap Share, then Add to Home Screen");
   break;
 }
});
function commit(){
 editing.review=false;
 const i=S.cards.findIndex(c=>c.id===editing.id);
 if(i===-1)S.cards.unshift(editing);else S.cards[i]=editing;
 pushCard(editing);return editing;
}
document.addEventListener("input",e=>{
 const el=e.target;
 if(el.id==="q"){F.q=el.value;F.limit=50;
  const pane=document.querySelector(".pane");if(!pane)return;
  clearTimeout(window._qt);window._qt=setTimeout(()=>{const p=el.selectionStart;render();
   const q2=document.getElementById("q");if(q2){q2.focus();q2.setSelectionRange(p,p);}},220);return;}
 if(el.dataset.h!==undefined){
  const key=el.dataset.h;
  if(sessEdit&&SESS_COLS.indexOf(key)>-1&&["number","played_on","title","place","present","recap","loot","xp","cliffhanger"].indexOf(key)>-1){
   sessEdit[key]=el.value;
  }else if(["number","played_on","title","place","present","recap","loot","xp","cliffhanger"].indexOf(key)>-1){
   sessEdit=sessEdit||blankSession((sessions[0]?n(sessions[0].number):0)+1);
   sessEdit[key]=el.value;
  }else{
   heroEdit=heroEdit||Object.assign({},myHero()||blankHero());
   heroEdit[key]=el.value;
   if(key==="klass"&&!heroEdit.hit_die)heroEdit.hit_die=(CLASS_INFO[el.value]||{}).hd||"";
  }
  return;
 }
 if(el.dataset.dice!==undefined){diceState[el.dataset.dice]=n(el.value);return;}
 if(el.dataset.f&&editing){
  // typing a value yourself counts as verifying it
  if(["vRaw","v9","v10"].indexOf(el.dataset.f)>-1&&String(el.value)!==String(editing[el.dataset.f])){
   editing.verified=true;
  }
  editing[el.dataset.f]=el.value;
  const lt=document.querySelector(".lt code");if(lt)lt.textContent=title(editing);
  if(["graded","status","conf","vRaw","v9","v10"].includes(el.dataset.f)){
   clearTimeout(window._rt);window._rt=setTimeout(()=>{const a=document.activeElement,k=a&&a.dataset?a.dataset.f:null,
    p=a&&a.selectionStart;render();if(k){const el2=document.querySelector(`[data-f="${k}"]`);
    if(el2){el2.focus();try{el2.setSelectionRange(p,p);}catch(_){}}}},450);}
  return;}
 if(el.dataset.set){S.settings[el.dataset.set]=el.value;
  clearTimeout(window._st);window._st=setTimeout(pushSettings,700);}
});
document.addEventListener("change",async e=>{
 if((e.target.id==="scancam"||e.target.id==="scanlib")&&e.target.files.length){
  enqueue(e.target.files);e.target.value="";return;}
 if(e.target.id==="csvin"&&e.target.files[0]){
  const fr=new FileReader();fr.onload=()=>{try{importCSV(String(fr.result));}
   catch(_){toast("Import failed — needs a CSV with a header row");}};
  fr.readAsText(e.target.files[0]);e.target.value="";}
 if(e.target.id==="artin"&&e.target.files[0]){
  const slot=window._artSlot||1;
  toast("Uploading drawing…");
  try{
   const d2=await compress(e.target.files[0],1400,0.85);
   heroEdit=heroEdit||Object.assign({},myHero()||blankHero());
   const url=await uploadArt(heroEdit.id,slot,d2);
   heroEdit["art"+slot]=url;
   render(); toast("Drawing added — remember to save");
  }catch(_){toast("Could not upload that image");}
  e.target.value=""; return;}
 if(e.target.id==="avin"&&e.target.files[0]){
  toast("Uploading…");
  try{
   const d=await compress(e.target.files[0],400,0.8);
   const blob=await (await fetch(d)).blob();
   const path=user.id+"/avatar.jpg";
   const base=cfg.url.replace(/\/+$/,"");
   const r=await fetch(base+"/storage/v1/object/cards/"+path,{method:"POST",
    headers:{"apikey":cfg.key,"Authorization":"Bearer "+(authToken||cfg.key),
     "Content-Type":"image/jpeg","x-upsert":"true"},body:blob});
   if(!r.ok)throw new Error("upload failed");
   S.settings.avatar=base+"/storage/v1/object/public/cards/"+path+"?v="+Date.now();
   pushSettings();render();toast("Photo saved");
  }catch(_){toast("Could not upload that photo");}
  e.target.value="";return;}
 if(e.target.id==="picin"&&e.target.files[0]&&editing){
  toast("Uploading photo…");
  try{const d=await compress(e.target.files[0]);
   const url=await uploadPhoto(editing.id,picTarget,d);
   editing[picTarget==="F"?"photoF":"photoB"]=url;commit();render();toast("Photo saved");}
  catch(err){toast(err.message||"Couldn't upload that image");}
  e.target.value="";}
});
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;});
window.addEventListener("resize",positionTabs);

/* Pinch-zoom traps position:fixed overlays on iOS — the header can end up
   off-screen with no page scroll to reach it. When zoomed, unpin the sheet
   so normal scrolling works and every control stays reachable. */
(function watchZoom(){
 const vv=window.visualViewport;
 if(!vv)return;
 const apply=()=>{
  const b=document.body;
  if(!b||!b.classList)return;
  if(vv.scale>1.05)b.classList.add("zoomed"); else b.classList.remove("zoomed");
 };
 vv.addEventListener("resize",apply);
 vv.addEventListener("scroll",apply);
 apply();
})();

async function measure(){
 if(!navigator.storage||!navigator.storage.estimate)return;
 try{const e=await navigator.storage.estimate();
  const fmt=b=>b>1e9?(b/1e9).toFixed(1)+" GB":Math.round(b/1e6)+" MB";
  storeInfo={used:fmt(e.usage||0),quota:fmt(e.quota||0),
   pct:e.quota?Math.round((e.usage/e.quota)*100):0,
   persisted:navigator.storage.persisted?await navigator.storage.persisted():false};
 }catch(_){}
}

/* ============ boot ============ */
async function checkSession(){
 if(!sb)return;
 let data=null;
 try{const res=await raced(sb.auth.getSession(),8000,"session check");data=res&&res.data;}
 catch(_){setSync("offline");}
 user=data&&data.session?data.session.user:null;
 if(user){
  authToken=data.session.access_token;
  claimCache();
  render();
  hideSplash();
  try{await pullAll();}catch(_){}
  loadAccount().then(render);
  render();
 }else{
  render();
  hideSplash();
 }
}
(async function boot(){
 loadCfg();
 if(cfg)initClient();
 loadCache();          // show what we already have, immediately
 render();
 if(sb){
  sb.auth.onAuthStateChange(async (evt,sess)=>{
   const was=user?user.id:null;
   user=sess?sess.user:null;
   authToken=sess?sess.access_token:null;
   if(user&&user.id!==was){render();try{await pullAll();}catch(_){}}
   render();
  });
  await checkSession();
 }
 measure().then(()=>{if(tab==="setup")render();});
 window.addEventListener("focus",()=>{if(user&&!rq.length&&!scanning)pullAll().then(render);});
})();
if("serviceWorker"in navigator){
 navigator.serviceWorker.register("sw.js").then(r=>{
  if(r&&r.update)r.update();          // always check for a newer worker
 }).catch(()=>{});
 // clear anything cached by earlier versions of this app
 if(window.caches)caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))).catch(()=>{});
}
</script>
