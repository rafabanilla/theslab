<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Slab</title>
<meta name="theme-color" content="#15171B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Slab">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15171B; --paper:#E7EAEE; --label:#FFFFFF; --rule:#C6CCD5;
  --mute:#6E7681; --red:#C8102E; --gold:#9C7412; --green:#166B45;
  --shadow:0 1px 0 rgba(21,23,27,.06),0 2px 10px rgba(21,23,27,.07);
  --disp:'Oswald','Arial Narrow',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* header */
.hdr{background:var(--ink);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 0;position:sticky;top:0;z-index:20}
.hdr-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:3px}
.brand{display:flex;align-items:center;gap:9px}
.hdr-mark{width:21px;height:21px;flex-shrink:0;display:block}
.wordmark{font-family:var(--disp);letter-spacing:.14em;font-size:19px}
.wm-1{font-weight:400;opacity:.55;margin-right:6px}
.wm-2{font-weight:600}
.save{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
.hdr-right{display:flex;align-items:center;gap:9px;min-width:0}
.hdr-av{width:24px;height:24px;border-radius:50%;object-fit:cover;flex-shrink:0;
 border:1px solid rgba(255,255,255,.3)}

/* setup: collapsible sections instead of one long scroll */
.setup{padding-top:12px}
.sec{background:var(--label);border:1px solid var(--rule);border-radius:3px;margin-bottom:8px;
 overflow:hidden}
.sec summary{display:flex;align-items:center;justify-content:space-between;gap:8px;
 padding:14px 14px;cursor:pointer;list-style:none;user-select:none}
.sec summary::-webkit-details-marker{display:none}
.sec summary::after{content:"\203A";transform:rotate(90deg);color:var(--mute);font-size:16px;
 margin-left:auto;transition:transform .15s}
.sec[open] summary::after{transform:rotate(-90deg)}
.sec-t{font-family:var(--disp);font-size:13px;letter-spacing:.11em;text-transform:uppercase}
.sec-n{font-family:var(--mono);font-size:10px;background:var(--ink);color:#fff;
 border-radius:9px;padding:2px 7px}
.sec-b{padding:0 14px 16px;border-top:1px solid var(--rule)}
.sec-b .btn.wide{margin-top:8px}
.sec-b .note:first-child{margin-top:12px}
.sec-b .tbl{margin-top:10px}

.avrow{display:flex;align-items:center;gap:12px;margin:14px 0 12px}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0}
.av.ph{background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;
 font-family:var(--disp);font-size:22px}
.avtext{min-width:0}
.avname{font-family:var(--disp);font-size:17px}
.avsub{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:2px;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.kpi{background:var(--ink);color:#fff;padding:14px 16px;border-radius:2px;margin:12px 0 0}
.kpi.warn{background:#5C4409}
.kpi-l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.55}
.kpi-v{font-family:var(--mono);font-weight:600;font-size:26px;margin:3px 0 1px}
.kpi-s{font-family:var(--mono);font-size:11px;opacity:.75}
.collname{font-family:var(--disp);font-size:11px;letter-spacing:.11em;color:#fff;opacity:.55;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
.ticker{display:flex;margin-top:12px;border-top:1px solid rgba(255,255,255,.16)}
.tick{flex:1;padding:9px 4px 11px;border-right:1px solid rgba(255,255,255,.12)}
.tick:last-child{border-right:none}
.tick-v{font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:-.02em}
.tick-l{font-size:9px;letter-spacing:.13em;text-transform:uppercase;opacity:.5;margin-top:2px}
.tick.hot .tick-v{color:#FF6B7F}
.tabs{display:flex;background:var(--ink);padding:0 16px;position:sticky;z-index:19}
.tab{flex:1;padding:11px 0 12px;font-family:var(--disp);font-size:12px;letter-spacing:.11em;
  text-transform:uppercase;color:rgba(255,255,255,.5);border-bottom:2px solid transparent}
.tab.on{color:#fff;border-bottom-color:var(--red)}

.pane{padding:16px 14px 40px;max-width:820px;margin:0 auto}
.search{width:100%;padding:12px 14px;border:1px solid var(--rule);border-radius:2px;background:var(--label);
  font-size:16px;font-family:inherit;color:var(--ink)}
.fbar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px}
.fpill{display:flex;align-items:center;justify-content:center;gap:3px;padding:9px 4px;
 border:1px solid var(--rule);background:var(--label);border-radius:2px;font-size:11.5px;
 color:var(--mute);white-space:nowrap;overflow:hidden}
.fpill.active{border-color:var(--ink);color:var(--ink);font-weight:600}
.fpill.open{background:var(--ink);color:#fff;border-color:var(--ink)}
.fnum{background:var(--red);color:#fff;border-radius:8px;font-size:9px;padding:1px 5px;font-weight:600}
.fcar{font-size:8px;opacity:.6}
.fpanel{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;padding:10px;
 background:var(--label);border:1px solid var(--rule);border-radius:2px}
.fopt{padding:7px 11px;border:1px solid var(--rule);background:var(--paper);border-radius:2px;
 font-size:12px;color:var(--ink)}
.fopt.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.foptn{opacity:.55;font-size:10px;font-family:var(--mono)}
.fclear{margin-top:7px}
.fclear button{font-family:var(--mono);font-size:10.5px;color:var(--red);text-decoration:underline}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:6px 11px;border:1px solid var(--rule);background:var(--label);
  font-size:12px;border-radius:2px;color:var(--mute)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.alt{font-family:var(--mono);font-size:11px}
.count{display:flex;align-items:baseline;justify-content:space-between;
 font-family:var(--mono);font-size:11px;color:var(--mute);margin:12px 0 8px;letter-spacing:.04em}
.count-v{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.01em}

/* signature: the slab row */
.slab{display:flex;background:var(--label);border:1px solid var(--rule);border-radius:2px;
  margin-bottom:8px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
.slab:active{transform:translateY(1px)}
.cg{width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;padding:8px 2px;background:var(--ink);color:#fff}
.cg.g10{background:var(--gold)}
.cg.g8{background:#4A515C}
.cg.raw{background:repeating-linear-gradient(135deg,#EDEFF2,#EDEFF2 5px,#E3E6EB 5px,#E3E6EB 10px);color:var(--mute)}
.cg-co{font-family:var(--disp);font-size:9px;letter-spacing:.1em}
.cg-n{font-family:var(--disp);font-weight:600;font-size:22px;line-height:1}
.cg-raw{font-family:var(--disp);font-size:11px;letter-spacing:.13em}
.sb{flex:1;padding:9px 11px;min-width:0}
.sl{display:flex;gap:6px;align-items:baseline;font-family:var(--disp);font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.sl-yr{color:var(--red);font-weight:600}
.sl-set{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sn{font-family:var(--disp);font-weight:500;font-size:17px;margin:2px 0 0;letter-spacing:.01em}
.sm{display:flex;gap:8px;font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:2px}
.sf{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;padding-top:6px;
  border-top:1px dashed var(--rule);font-family:var(--mono);font-size:11px}
.sku{color:var(--mute);letter-spacing:.05em}
.val{font-weight:600;font-size:13px}
.flag{margin-top:6px;font-size:11px;font-weight:600;color:var(--green);background:#E4F2EA;
  padding:4px 7px;border-radius:2px;display:inline-block}
.flag.soft{color:var(--mute);background:#EDEFF2;font-weight:400}
.thumb{width:64px;object-fit:cover;border-left:1px solid var(--rule);flex-shrink:0;background:#EDEFF2}

.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:56px;height:56px;
  border-radius:50%;background:var(--red);color:#fff;font-size:30px;line-height:1;z-index:30;
  box-shadow:0 4px 16px rgba(200,16,46,.4)}

.section{margin-top:22px}
.sec-hd{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:5px;margin-bottom:10px}
.sec-hd h2{font-family:var(--disp);font-weight:500;font-size:14px;letter-spacing:.11em;text-transform:uppercase;margin:0}
.sec-hd span{font-family:var(--mono);font-size:11px;color:var(--mute)}
.grow{background:var(--label);border:1px solid var(--rule);border-radius:2px;padding:10px 12px;margin-bottom:7px;cursor:pointer}
.grow-hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.grow-t{font-size:13px;font-weight:500;line-height:1.3}
.grow-net{font-family:var(--mono);font-size:13px;font-weight:600;white-space:nowrap;color:var(--mute)}
.grow-net.pos{color:var(--green)}
.grow-empty{font-size:12px;color:var(--mute);margin-top:5px}
.bars{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.bar{display:flex;align-items:center;gap:8px}
.bar-l{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);width:42px;flex-shrink:0}
.bar-tr{flex:1;height:8px;background:#EDEFF2;border-radius:1px;overflow:hidden}
.bar-f{height:100%}
.b-raw{background:#9AA2AD}.b-9{background:var(--ink)}.b-10{background:var(--gold)}
.bar-v{font-family:var(--mono);font-size:11px;width:58px;text-align:right;flex-shrink:0}

.bigstat{background:var(--ink);color:#fff;padding:20px 18px;border-radius:2px}
.bs-l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.55}
.bs-v{font-family:var(--mono);font-weight:600;font-size:38px;letter-spacing:-.03em;margin:4px 0 2px}
.bs-d{font-family:var(--mono);font-size:12px;opacity:.8}
.bs-d.pos{color:#6FD69F}.bs-d.neg{color:#FF8A8A}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.stat{background:var(--label);border:1px solid var(--rule);padding:12px;border-radius:2px}
.st-l{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.st-v{font-family:var(--mono);font-weight:600;font-size:19px;margin:3px 0 1px}
.st-s{font-size:11px;color:var(--mute)}
.warn{margin-top:10px;background:#FDF0D9;border-left:3px solid var(--gold);padding:9px 11px;font-size:12px}
.tbl{width:100%;border-collapse:collapse;background:var(--label);font-size:13px}
.tbl th{text-align:left;font-family:var(--disp);font-weight:400;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mute);padding:7px 9px;border-bottom:1px solid var(--rule)}
.tbl td{padding:8px 9px;border-bottom:1px solid #EDEFF2;font-family:var(--mono);font-size:12px}
.tbl td:first-child{font-family:var(--body)}
.pos{color:var(--green)}.neg{color:var(--red)}

.fld{display:block;margin-bottom:10px}
.fld-l{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);
  margin-bottom:4px;font-weight:500}
.fld-i{width:100%;padding:11px 12px;border:1px solid var(--rule);border-radius:2px;background:var(--label);
  font-size:16px;font-family:inherit;color:var(--ink)}
textarea.fld-i{resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.divider{font-family:var(--disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);
  margin:20px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--rule)}
.toggle{display:flex;margin-bottom:12px;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.tg{flex:1;padding:10px;font-size:13px;background:var(--label);color:var(--mute)}
.tg.on{background:var(--ink);color:#fff}
.btn{background:var(--ink);color:#fff;padding:12px 16px;border-radius:2px;font-family:var(--disp);
  font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn.danger{background:var(--red)}
.btn.wide{display:block;width:100%;margin-top:10px}
.empty{text-align:center;padding:50px 20px;color:var(--mute)}
.note{font-size:12px;color:var(--mute);line-height:1.55;margin-bottom:12px}
.note code{font-family:var(--mono);background:#DDE1E7;padding:1px 4px;font-size:11px}
.ev{background:var(--label);border:1px solid var(--rule);border-radius:2px;padding:11px 12px;margin:4px 0 12px}
.ev-empty{color:var(--mute);font-size:12px;line-height:1.55}
.ev-hd{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--disp);
 font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);
 border-bottom:1px solid var(--rule);padding-bottom:5px;margin-bottom:7px}
.ev-when{font-family:var(--mono);font-size:10px;letter-spacing:0}
.ev-tbl{width:100%;border-collapse:collapse;font-size:12px}
.ev-tbl td{padding:4px 6px 4px 0;font-family:var(--mono);font-size:11.5px;vertical-align:baseline}
.ev-tbl td:first-child{font-family:var(--body);color:var(--mute);width:34%}
.ev-med{font-weight:600;font-size:13px}
.ev-none{color:var(--gold);font-family:var(--body)!important;font-size:11.5px}
.ev-sub{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:10px 0 4px}
.ev-list{list-style:none;margin:0;padding:0}
.ev-list li{display:flex;gap:8px;align-items:baseline;font-family:var(--mono);font-size:11px;
 padding:3px 0;border-bottom:1px dashed #EDEFF2}
.ev-p{font-weight:600;width:52px;flex-shrink:0}
.ev-b{width:52px;flex-shrink:0;color:var(--mute)}
.ev-d{width:76px;flex-shrink:0;color:var(--mute)}
.ev-s{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.confbox{background:#fff;border:1px solid var(--red);border-left:4px solid var(--red);
 padding:13px;margin-top:10px;font-size:13px;line-height:1.5;border-radius:2px}
.confrow{display:flex;gap:8px;margin-top:11px}
.confrow .btn{flex:1}
.lookup{border:1px dashed var(--rule);border-radius:2px;padding:10px 12px;margin:0 0 12px}
.lookup-hd{font-family:var(--disp);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
 color:var(--mute);margin-bottom:7px}
.lookup-row{display:flex;flex-wrap:wrap;gap:6px}
.lookup-a{flex:1 1 auto;text-align:center;padding:7px 9px;border:1px solid var(--rule);
 border-radius:2px;background:var(--label);font-size:11.5px;color:var(--ink);text-decoration:none;
 white-space:nowrap}
.lookup-a:active{background:var(--ink);color:#fff}
.lookup-q{font-family:var(--mono);font-size:10px;color:var(--mute);margin:8px 0 0;line-height:1.5}
.lookup-q code{background:#DDE1E7;padding:1px 4px}
.trs{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tr{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
 background:#DDE1E7;color:var(--mute);padding:2px 5px;border-radius:2px}
.tr.hot{background:var(--ink);color:#fff}
.trpick{display:flex;flex-wrap:wrap;gap:5px}
.trbtn{padding:7px 10px;border:1px solid var(--rule);background:var(--label);border-radius:2px;
 font-size:12px;color:var(--mute)}
.trbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ev-src{display:inline-block;font-family:var(--mono);font-size:10px;color:var(--red);
 text-decoration:underline;margin:0 0 6px}
.ev-path{font-family:var(--mono);font-size:10px;color:var(--mute);margin:-3px 0 7px;letter-spacing:.03em}
.ev-path.free{color:var(--green);font-weight:600}
.ev-tier{font-family:var(--body);font-size:10.5px;color:var(--mute)}
.ev-crack{font-size:11.5px;line-height:1.5;color:var(--mute);background:#EDF1F5;
 border-left:3px solid var(--rule);padding:8px 10px;margin:8px 0 0}
.ev-crack.warn{background:#FDF0D9;border-left-color:var(--gold);color:#5C4409}
.ev-guide{color:var(--gold);font-family:var(--body);font-size:11px}
.ev-est{color:var(--mute);font-family:var(--body);font-size:11px;font-style:italic}
.ev-soft{opacity:.72}
.ev-est-box{background:#EDF1F5;border-left:3px solid var(--gold);padding:9px 10px;margin-top:9px;
 font-size:11.5px;line-height:1.55;color:#4A5058}
.ev-note{background:#EDF1F5;border-left:3px solid var(--mute);padding:9px 10px;margin-top:9px;
 font-size:11.5px;line-height:1.5;color:var(--mute)}
.ev-warn{background:#FDF0D9;border-left:3px solid var(--gold);padding:9px 10px;margin-top:9px;
 font-size:11.5px;line-height:1.5;color:#5C4409}
.val-n{font-family:var(--mono);font-size:9.5px;font-weight:400;color:var(--mute);letter-spacing:.02em}
.foot{display:flex;align-items:center;justify-content:center;gap:7px;
 max-width:820px;margin:8px auto 0;padding:16px 14px 26px;
 border-top:1px solid var(--rule);color:var(--mute)}
.foot-mark{width:13px;height:13px;flex-shrink:0;color:var(--ink);opacity:.75}
.foot-name{font-family:var(--disp);font-size:10px;letter-spacing:.16em;color:var(--ink);opacity:.7}
.foot-sep{opacity:.4;font-size:10px}
.foot-ver,.foot-by{font-family:var(--mono);font-size:10px;letter-spacing:.04em}
.foot-by{color:var(--red);opacity:.75}
.diag{font-family:var(--mono);font-size:11px;line-height:1.6;background:var(--ink);color:#D6DAE0;
 padding:12px;border-radius:2px;overflow-x:auto;white-space:pre;margin-top:10px}
.note.ok{color:var(--green);font-weight:500}

.sheet-wrap{position:fixed;inset:0;background:rgba(21,23,27,.5);z-index:50;display:flex;align-items:flex-end}
body.zoomed .sheet-wrap{position:absolute;top:0;left:0;right:0;bottom:auto;min-height:100vh;align-items:flex-start}
body.zoomed .sheet{max-height:none}
body.zoomed .sheet-body{overflow-y:visible;max-height:none}
body.zoomed .hdr,body.zoomed .tabs{position:static}
.sheet-foot{display:flex;gap:8px;margin:18px 0 4px;padding-top:14px;border-top:1px solid var(--rule)}
.sheet-foot .btn{flex:1}
.sheet{background:var(--paper);width:100%;max-height:94vh;display:flex;flex-direction:column;
  border-radius:6px 6px 0 0;overflow:hidden;max-width:820px;margin:0 auto}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
  background:var(--ink);color:#fff;flex-shrink:0}
.sheet-t{font-family:var(--mono);font-size:12px;letter-spacing:.08em}
.x{color:rgba(255,255,255,.7);font-size:13px}
.x.go{color:#fff;font-weight:600;font-family:var(--disp);letter-spacing:.1em;text-transform:uppercase}
.sheet-body{overflow-y:auto;padding:16px 14px calc(40px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.shot{position:relative;background:var(--label);border:1px dashed var(--rule);border-radius:2px;
  aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;overflow:hidden}
.shot img{width:100%;height:100%;object-fit:contain}
.shot-l{font-family:var(--disp);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.shot-x{position:absolute;top:4px;right:4px;background:rgba(21,23,27,.8);color:#fff;border-radius:2px;
  font-size:10px;padding:3px 6px;font-family:var(--mono)}
.verdict{padding:11px 12px;border-radius:2px;font-size:12.5px;line-height:1.5;margin:6px 0 4px}
.v-grade{background:#E4F2EA;border-left:3px solid var(--green);color:#0F4B30}
.v-maybe{background:#FDF0D9;border-left:3px solid var(--gold);color:#5C4409}
.v-skip{background:#EDEFF2;border-left:3px solid var(--mute);color:var(--mute)}
.lt{background:var(--label);border:1px dashed var(--rule);padding:9px 11px;margin:16px 0 4px}
.lt span{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
.lt code{font-family:var(--mono);font-size:11.5px;line-height:1.5;word-break:break-word}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:3px;font-size:13px;z-index:60;
  box-shadow:0 4px 20px rgba(0,0,0,.3);max-width:90vw;text-align:center}

/* gate screens */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gwrap{width:100%;max-width:440px;background:var(--label);border:1px solid var(--rule);
  border-radius:3px;padding:26px 22px;box-shadow:var(--shadow)}
.gt{font-family:var(--disp);font-weight:500;font-size:26px;margin:0 0 8px;letter-spacing:.01em}
.gp{font-size:13px;line-height:1.6;color:var(--mute);margin:0 0 16px}
.gp.small{font-size:11.5px;margin-top:14px;margin-bottom:0}
.glist{font-size:13px;line-height:1.7;color:var(--mute);padding-left:20px;margin:0 0 18px}
.glist b{color:var(--ink)}
.gmsg{margin-top:12px;background:#FDF0D9;border-left:3px solid var(--gold);
  padding:10px 12px;font-size:12.5px;line-height:1.5;color:#5C4409}

/* price refresh */
.rbanner{position:sticky;top:140px;z-index:18;display:flex;align-items:center;gap:10px;
  background:var(--gold);color:#fff;padding:8px 14px;font-size:12px;font-family:var(--mono)}
.rcount{margin-left:auto;opacity:.85}
.rstop{color:#fff;text-decoration:underline;font-size:11px;font-family:var(--mono)}
.mini{font-family:var(--mono);font-size:10px;color:var(--red);text-decoration:underline;
  margin-left:8px;letter-spacing:.03em}
.flag.stale{color:#5C4409;background:#FDF0D9;font-weight:500}

/* scan view */
.hero{background:var(--ink);color:#fff;padding:26px 20px 24px;border-radius:3px;margin-bottom:6px}
.hero-t{font-family:var(--disp);font-weight:500;font-size:27px;line-height:1.15;margin:0 0 10px}
.hero-s{font-size:13px;line-height:1.6;opacity:.7;margin:0 0 18px}
.btn.big{display:block;width:100%;padding:15px;font-size:14px;background:var(--red);margin-bottom:8px}
.hero .btn.ghost.big{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);margin-bottom:0}
.qrow{display:flex;align-items:center;gap:11px;background:var(--label);border:1px solid var(--rule);
  border-radius:2px;padding:9px 11px;margin-bottom:7px}
.qrow.done{cursor:pointer}
.qimg{width:38px;height:52px;object-fit:cover;border-radius:1px;flex-shrink:0;background:#DDE1E7}
.qimg.ph{background:repeating-linear-gradient(135deg,#EDEFF2,#EDEFF2 4px,#E3E6EB 4px,#E3E6EB 8px)}
.qbody{flex:1;min-width:0}
.qname{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qstate{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:3px}
.qstate .bad{color:var(--red)}
.els{color:var(--gold);font-weight:600}
.pulse{animation:pl 1.4s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.45}50%{opacity:1}}
.qdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.qdot.ok{background:var(--green)}.qdot.warn{background:var(--gold)}
.tips{margin-top:24px;border-top:1px solid var(--rule);padding-top:14px}
.tips p{font-size:12px;line-height:1.6;color:var(--mute);margin:0 0 9px}
.tips b{color:var(--ink)}
.flag.warn{color:#5C4409;background:#FDF0D9;font-weight:600}
.flag.ok{color:var(--green);background:#E4F2EA;font-weight:600}
@media (min-width:700px){
  .pane{padding:22px}
  .sheet-wrap{align-items:center;padding:20px}
  .sheet{border-radius:6px;max-height:88vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
"use strict";
/* ============ constants ============ */
const KEY="theslab.v1";
// Increment by one on every build. Nothing else — the number is the whole point.
const VERSION="57";
const CATS=["NBA","WNBA","NFL","MLB","NHL","Soccer","Boxing/MMA","Pokemon","Magic","Yu-Gi-Oh","Other TCG","Sealed product","Funko Pop","Entertainment","Other"];
const GRADERS=["PSA","BGS","SGC","CGC","GCC","WCG","HGA","TAG","Other"];
const TRAITS_ANY=["numbered","auto","relic","rookie","1st-edition"];
const TRAITS_TCG=["ex","v","vmax","vstar","gx","full-art","illustration-rare",
 "special-illustration-rare","secret-rare","holo","reverse-holo"];
const TRAIT_LABEL={numbered:"numbered",auto:"auto",relic:"patch/relic",rookie:"rookie",
 "1st-edition":"1st ed",ex:"ex",v:"V",vmax:"VMAX",vstar:"VSTAR",gx:"GX","full-art":"full art",
 "illustration-rare":"IR","special-illustration-rare":"SIR","secret-rare":"secret",
 holo:"holo","reverse-holo":"reverse holo"};
const isTCG=c=>["Pokemon","Magic","Yu-Gi-Oh","Other TCG"].indexOf(c&&c.cat)>-1;
/* Not single cards — no grading maths, no PSA tiers. */
const NON_CARD=["Sealed product","Funko Pop"];
const isItem=c=>NON_CARD.indexOf(c&&c.cat)>-1;
function goatNames(){
 return String(S.settings.goats||"").split(/[,;\n]+/).map(s=>s.trim().toLowerCase()).filter(Boolean);
}
function isGoat(c){
 const s=String(c&&c.subject||"").trim().toLowerCase();
 if(!s)return false;
 return goatNames().some(g=>s===g||s.indexOf(g)>-1||g.indexOf(s)>-1);
}
function traitList(c){
 const raw=String((c&&c.traits)||"").toLowerCase();
 const set=raw.split(/[,;]+/).map(s=>s.trim()).filter(Boolean);
 // a serial number always means numbered, whatever the scan said
 if(c&&c.serial&&set.indexOf("numbered")===-1)set.push("numbered");
 return set.filter((v,i,a)=>a.indexOf(v)===i);
}
function setTrait(c,t,on){
 const list=traitList(c).filter(x=>x!==t);
 if(on)list.push(t);
 c.traits=list.join(",");
}
const DEF_SET={photoBase:"",photoExt:"jpg",gradingCost:30,feePct:13,currency:"$",staleDays:90,nickname:"",avatar:"",gradeWith:"PSA",goats:"Michael Jordan, Kobe Bryant, LeBron James, Stephen Curry, Magic Johnson, Larry Bird, Kareem Abdul-Jabbar, Wilt Chamberlain, Shaquille O'Neal, Tim Duncan, Victor Wembanyama, Shohei Ohtani, Babe Ruth, Mickey Mantle, Willie Mays, Hank Aaron, Ken Griffey Jr, Mike Trout, Tom Brady, Jerry Rice, Joe Montana, Peyton Manning, Patrick Mahomes, Pele, Diego Maradona, Lionel Messi, Cristiano Ronaldo, Kylian Mbappe, Wayne Gretzky, Mario Lemieux, Connor McDavid, Muhammad Ali, Mike Tyson, Jon Jones, Roger Federer, Serena Williams, Rafael Nadal, Novak Djokovic, Tiger Woods, Jack Nicklaus, Lewis Hamilton, Ayrton Senna, Michael Schumacher, Caitlin Clark, A'ja Wilson, Diana Taurasi",usage:null};
const CONF={low:{p10:.08,p9:.32},med:{p10:.22,p9:.45},high:{p10:.42,p9:.42}};
/* Where a submission actually lands, by how the card looks. Real grading
   outcomes spread across 7 through 10 — treating everything below 9 as
   "roughly raw" understates rough cards and overstates clean ones. */
const LADDER={
 low: {g7:.20,g8:.34,g9:.32,g95:.06,g10:.04,below:.04},
 med: {g7:.06,g8:.22,g9:.44,g95:.14,g10:.12,below:.02},
 high:{g7:.02,g8:.09,g9:.34,g95:.23,g10:.31,below:.01},
};
const TEN_KEY={PSA:"psa10",BGS:"bgs10",CGC:"cgc10",SGC:"sgc10"};
function tierValues(c){
 const t=c.evidence&&c.evidence.tiers;
 if(!t)return null;
 // A ladder where the grades match the raw figure is a misread table, not a market.
 const asc=[n(t.ungraded),n(t.g7),n(t.g8),n(t.g9),n(t.g95)].filter(v=>v>0);
 for(let i=1;i<asc.length;i++)if(asc[i]<=asc[i-1])return null;
 const tenKey=TEN_KEY[String(S.settings.gradeWith||"PSA").toUpperCase()]||"psa10";
 const v={g7:n(t.g7),g8:n(t.g8),g9:n(t.g9),g95:n(t.g95),g10:n(t[tenKey])||n(t.psa10)};
 // a ladder with nothing on it is no use
 return (v.g9||v.g10||v.g8)?v:null;
}

const SEED=[
["MJ-001","1991","Hoops","Michael Jordan","5","MVP","GCC","10",12,"est"],
["MJ-002","1997","UD Collector's Choice","Michael Jordan","193","Catch 23","GCC","10",10,"est"],
["MJ-003","1994","UD Collector's Choice","Michael Jordan","240","","GCC","10",8,"est"],
["MJ-004","1992","Fleer","Michael Jordan","232","League Leader","GCC","10",10,"est"],
["MJ-005","1999","Upper Deck","Michael Jordan","67","Athlete of the Century","PSA","9",25,"est"],
["MJ-006","1989","Hoops","Michael Jordan","21","All-Star","PSA","9",27,"comp"],
["MJ-007","1995","Topps","Michael Jordan","4","Active Leader","CGC","6.5",8,"est"],
["MJ-008","1996","Collector's Choice","Michael Jordan","25","Bulls Victory Tour","CGC","9",15,"est"],
["MJ-009","1995","Topps","Michael Jordan","4","Active Leader","PSA","9",20,"est"],
["KB-001","1996","Score Board","Kobe Bryant","15","Rookie","PSA","9",35,"comp"],
["MJ-010","1993","Upper Deck","Michael Jordan","171","Season Leaders","PSA","8",12,"est"],
["MJ-011","1993","Upper Deck","Michael Jordan","P5","","CGC","10",25,"est"],
["MJ-012","1998","Fleer 23KT Gold","Michael Jordan","—","1986 Rookie reprint","WCG","10",25,"comp"],
["MJ-013","1991","Upper Deck","Michael Jordan","44","","PSA","8",12,"comp"],
["MJ-014","1990","Hoops","Michael Jordan","65","","PSA","8",16,"comp"],
["MJ-015","1991","Hoops","Michael Jordan","253","All-Star","PSA","8",10,"est"],
["MJ-016","1990","Fleer","Michael Jordan","26","","PSA","9",60,"comp"],
["MJ-017","1995","Upper Deck","Michael Jordan","JC1","Jordan Collection ROY","PSA","8",15,"est"]
];

/* ============ state ============ */
let S={cards:[],settings:{...DEF_SET}};
let tab="scan", editing=null, confirmDel=false;
let queue=[], scanning=false, storeInfo=null;
let F={q:"",cats:[],flags:[],traits:[],minVal:0,sort:"newest",limit:50,open:""};
let photoCache={}, picTarget=null, deferredPrompt=null;

function blank(sku){return{id:"c"+Date.now()+Math.random().toString(36).slice(2,6),sku:sku||"",cat:"NBA",
 year:"",set:"",subject:"",num:"",variant:"",serial:"",qty:1,graded:false,grader:"PSA",grade:"",cert:"",
 conf:"med",photoF:"",photoB:"",cost:"",acqDate:"",source:"",vRaw:"",v9:"",v10:"",pricedOn:"",
 status:"owned",listPrice:"",salePrice:"",saleDate:"",salePlatform:"",loc:"",notes:"",review:false,verified:false,traits:"",
 lastMove:0,evidence:null,addedAt:new Date().toISOString()};}

function seed(){return SEED.map(r=>{const c=blank(r[0]);c.id=r[0];c.sku=r[0];c.year=r[1];c.set=r[2];
 c.subject=r[3];c.num=r[4];c.variant=r[5];c.graded=true;c.grader=r[6];c.grade=r[7];c.vRaw=r[8];
 c.pricedOn="2026-08-13";c.notes=r[9]==="comp"?"[verified comp]":"[estimate — verify before selling]";return c;});}

/* ============ helpers ============ */
const n=v=>{const x=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isNaN(x)?0:x;};
const money=v=>S.settings.currency+n(v).toLocaleString(undefined,{maximumFractionDigits:0});
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function photoURL(c,w){return (w==="F"?c.photoF:c.photoB)||"";}

function title(c){return[c.year,c.set,c.subject,c.num?"#"+c.num:"",c.variant,c.serial?"/"+c.serial:"",
 c.graded?c.grader+" "+c.grade:"RAW"].filter(Boolean).join(" ");}

function gradeCall(c){
 if(c.graded||isItem(c))return null;
 const raw=n(c.vRaw);
 let v9=n(c.v9),v10=n(c.v10);
 // identical figures across tiers mean the source was misread — treat as unknown
 if(v9&&raw&&v9<=raw)v9=0;
 if(v10&&(v10<=raw||(v9&&v10<=v9)))v10=0;
 if(!raw&&!v9&&!v10)return{verdict:"unpriced",net:0};

 // Preferred: the full published ladder, 7 through 10, for the grader you use.
 const tv=tierValues(c);
 if(tv){
  const L=LADDER[c.conf]||LADDER.med;
  const fill=(x,fb)=>x||fb;
  const g8=fill(tv.g8,raw*1.4), g7=fill(tv.g7,raw*1.1);
  const g9=fill(tv.g9,g8*1.5), g95=fill(tv.g95,g9*1.6), g10=fill(tv.g10,g9*3);
  const ev=L.g7*g7+L.g8*g8+L.g9*g9+L.g95*g95+L.g10*g10+L.below*raw
    -n(S.settings.gradingCost);
  const net=ev-raw;
  let verdict="skip";
  if(net>n(S.settings.gradingCost)&&net>raw*.5)verdict="grade";
  else if(net>0)verdict="maybe";
  return{verdict,net,ladder:{g7,g8,g9,g95,g10},ev};
 }

 if(!v9&&!v10)return{verdict:"nograded",net:0};
 const p=CONF[c.conf]||CONF.med, pLow=Math.max(0,1-p.p10-p.p9);
 const ev=p.p10*v10+p.p9*v9+pLow*raw*1.15-n(S.settings.gradingCost);
 const net=ev-raw;
 let verdict="skip";
 if(v10<n(S.settings.gradingCost)*2)verdict="skip";
 else if(net>n(S.settings.gradingCost)&&net>raw*.5)verdict="grade";
 else if(net>0)verdict="maybe";
 return{verdict,net};
}

/* ============ cloud storage (Supabase) ============ */
const CFG="theslab.cfg", CACHE="theslab.cache";
let sb=null, user=null, syncState="", cfg=null, authToken=null, pending={}, acct=null;

/* Baked-in project. The anon key is designed to be public — row-level
   security in schema.sql is what protects the data. Never put the
   service_role key here. */
const BAKED={url:"https://yjqwgfrmethrzuzqmfnc.supabase.co",
 key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqcXdnZnJtZXRocnp1enFtZm5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MzAwNzksImV4cCI6MjEwMjMwNjA3OX0.Z6slVWn86mVFoZLkcsSmK6fOgjHz-YHOyIrSnV1xxoo"};
function loadCfg(){
 if(BAKED.url&&BAKED.key){cfg=BAKED;return cfg;}
 try{cfg=JSON.parse(localStorage.getItem(CFG)||"null");}catch(_){cfg=null;}
 return cfg;}
function saveCfg(url,key){cfg={url:url.trim().replace(/\/+$/,""),key:key.trim()};
 localStorage.setItem(CFG,JSON.stringify(cfg));}
function initClient(){
 if(!cfg||!window.supabase)return false;
 try{sb=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true}});
  return true;}catch(_){return false;}
}

/* local cache: instant load, read-only when offline */
let cacheLoaded=false;
function save(){
 if(!cacheLoaded)return;            // refuse to persist before we've read what's there
 try{localStorage.setItem(CACHE,JSON.stringify({...S,pending}));}catch(_){}
}
function loadCache(){try{const r=localStorage.getItem(CACHE);if(r){const d=JSON.parse(r);
 S.cards=d.cards||[];S.settings={...DEF_SET,...(d.settings||{})};pending=d.pending||{};
 cacheLoaded=true;return true;}}catch(_){}
 S.cards=[];cacheLoaded=true;return false;}

/* column mapping: JS camelCase <-> Postgres snake_case */
const MAP={sku:"sku",cat:"cat",year:"year",set:"set_name",subject:"subject",num:"num",
 variant:"variant",serial:"serial",qty:"qty",graded:"graded",grader:"grader",grade:"grade",
 cert:"cert",conf:"conf",cost:"cost",acqDate:"acq_date",source:"source",vRaw:"v_raw",
 v9:"v9",v10:"v10",pricedOn:"priced_on",lastMove:"last_move",status:"status",
 listPrice:"list_price",salePrice:"sale_price",saleDate:"sale_date",salePlatform:"sale_platform",
 loc:"loc",notes:"notes",review:"review",photoF:"photo_f",photoB:"photo_b",
 evidence:"evidence",traits:"traits",verified:"verified"};
const NUMCOL=["qty","cost","v_raw","v9","v10","last_move","list_price","sale_price"];

function toRow(c){
 const r={id:c.id,user_id:user.id,updated_at:new Date().toISOString()};
 for(const k in MAP){
  let v=c[k];
  const col=MAP[k];
  if(col==="evidence"){r[col]=v||null;continue;}
  if(NUMCOL.indexOf(col)>-1)v=(v===""||v==null)?null:n(v);
  else if(col==="graded"||col==="review"||col==="verified")v=!!v;
  else v=(v===""||v==null)?null:String(v);
  r[col]=v;
 }
 return r;
}
function fromRow(r){
 const c=blank("");c.id=r.id;
 for(const k in MAP){
  const v=r[MAP[k]];
  if(k==="evidence"){c.evidence=v||null;continue;}
  c[k]=(v==null)?(k==="graded"||k==="review"?false:k==="qty"?1:""):v;
 }
 c.graded=!!r.graded;c.review=!!r.review;c.verified=!!r.verified;
 c.addedAt="";        // not a stored column — order comes from the id timestamp
 return c;
}

function setSync(s){syncState=s;const el=document.getElementById("saveflag");if(el){
 el.textContent=s;el.className="save"+(s==="offline"||s.indexOf("fail")>-1?" save-error":"");}}

function restHeaders(extra){
 return Object.assign({
  "apikey":cfg.key,
  "Authorization":"Bearer "+(authToken||cfg.key),
  "Content-Type":"application/json",
 },extra||{});
}
async function rest(path,opts,ms,label){
 const to=withTimeout(ms||20000);
 let r;
 try{r=await fetch(cfg.url.replace(/\/+$/,"")+path,Object.assign({signal:to.signal},opts));}
 catch(err){to.done();
  throw new Error(err&&err.name==="AbortError"?((label||"request")+" timed out"):("couldn't reach the database"));}
 to.done();
 if(!r.ok){
  let msg="";try{const j=await r.json();msg=j.message||j.error||JSON.stringify(j);}catch(_){msg="HTTP "+r.status;}
  throw new Error((label||"request")+" failed: "+msg);
 }
 if(r.status===204)return null;
 try{return await r.json();}catch(_){return null;}
}

async function pullAll(force){
 if(!sb||!user)return;
 // A rebuild mid-queue orphans the card being worked on. Wait for quiet.
 if(!force&&(rq.length||rActive||scanning)){setSync("sync deferred");return;}
 setSync("syncing");
 try{
  const data=await rest("/rest/v1/cards?select=*&order=updated_at.desc",
   {method:"GET",headers:restHeaders()},25000,"sync");
  if(!Array.isArray(data))throw new Error("sync returned nothing usable");
  const rows=data.map(fromRow);
  if(!rows.length&&S.cards.length){
   // server empty but we hold cards: keep ours and push them back rather than wiping
   setSync("server empty — keeping local");
   S.cards.forEach(c=>{pending[c.id]=true;});save();
   retryPending();return;
  }
  const seen={};rows.forEach(c=>{seen[c.id]=true;});
  // anything still unsaved locally survives the sync
  const keep=S.cards.filter(c=>pending[c.id]&&!seen[c.id]);
  S.cards=keep.concat(rows);
  if(keep.length)retryPending();
  try{const s=await rest("/rest/v1/settings?select=data&user_id=eq."+user.id,
    {method:"GET",headers:restHeaders()},15000,"settings");
   if(s&&s[0]&&s[0].data)S.settings={...DEF_SET,...s[0].data};}catch(_){}
  save();setSync("synced");setTimeout(()=>setSync(""),1500);
 }catch(e){setSync("sync failed — local kept");}
}
async function pushCard(c){
 save();
 if(!sb||!user){setSync("offline");return;}
 setSync("saving");
 try{await rest("/rest/v1/cards",{method:"POST",
   headers:restHeaders({"Prefer":"resolution=merge-duplicates,return=minimal"}),
   body:JSON.stringify([toRow(c)])},20000,"save");
  delete pending[c.id];save();
  setSync("saved");setTimeout(()=>setSync(""),1200);
 }catch(e){pending[c.id]=true;save();setSync("unsaved: "+Object.keys(pending).length);}
}
async function pushMany(list){
 save();
 if(!sb||!user){setSync("offline");return;}
 setSync("saving "+list.length);
 try{
  for(let i=0;i<list.length;i+=200){
   await rest("/rest/v1/cards",{method:"POST",
    headers:restHeaders({"Prefer":"resolution=merge-duplicates,return=minimal"}),
    body:JSON.stringify(list.slice(i,i+200).map(toRow))},30000,"save");
  }
  list.forEach(c=>delete pending[c.id]);save();
  setSync("saved");setTimeout(()=>setSync(""),1200);
 }catch(e){list.forEach(c=>{pending[c.id]=true;});save();
  setSync("unsaved: "+Object.keys(pending).length);}
}
function dupKey(c){
 const cert=String(c.cert||"").replace(/\D/g,"");
 // A cert number is definitive: same cert means the same physical slab.
 if(cert.length>=6)return "cert:"+cert;
 return [c.year,c.set,c.subject,c.num,c.variant,c.graded?c.grader+c.grade:"raw"]
  .map(x=>String(x||"").trim().toLowerCase()).join("|");
}
function findDupes(){
 const groups={};
 S.cards.forEach(c=>{
  if(!c.subject&&!c.set)return;
  const k=dupKey(c);(groups[k]=groups[k]||[]).push(c);
 });
 return Object.values(groups).filter(g=>g.length>1);
}
function score(c){
 // prefer the record that actually has data on it
 let s=0;
 ["vRaw","v9","v10","cost","photoF","photoB","cert","notes","acqDate"].forEach(k=>{if(c[k])s++;});
 if(c.pricedOn)s+=2;
 // a price read from the card's own grade tier beats one derived from raw
 if(c.evidence&&c.evidence.current&&!/ungraded/i.test(String(c.evidence.current.guides&&
   c.evidence.current.guides[0]&&c.evidence.current.guides[0].source||"")))s+=3;
 return s;
}
async function mergeDupes(){
 const groups=findDupes();
 if(!groups.length)return 0;
 let removed=0;
 for(const g of groups){
  const sorted=g.slice().sort((a,b)=>score(b)-score(a));
  const keep=sorted[0];
  for(const c of sorted.slice(1)){
   // carry over anything the keeper is missing
   ["vRaw","v9","v10","cost","photoF","photoB","cert","notes","acqDate","pricedOn","loc","source"]
    .forEach(k=>{if(!keep[k]&&c[k])keep[k]=c[k];});
   S.cards=S.cards.filter(x=>x.id!==c.id);
   await dropCard(c.id);
   delete pending[c.id];
   removed++;
  }
  await pushCard(keep);
 }
 save();
 return removed;
}

function compress(file,max=1400,q=.82){return new Promise((res,rej)=>{
 const fr=new FileReader();
 fr.onload=()=>{const img=new Image();
  img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));
   const cv=document.createElement("canvas");cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
   cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);res(cv.toDataURL("image/jpeg",q));};
  img.onerror=rej;img.src=fr.result;};
 fr.onerror=rej;fr.readAsDataURL(file);});}

function stats(){
 const owned=S.cards.filter(c=>c.status!=="sold"), sold=S.cards.filter(c=>c.status==="sold");
 const value=owned.reduce((a,c)=>a+n(c.vRaw)*(n(c.qty)||1),0);
 const cost=owned.reduce((a,c)=>a+n(c.cost)*(n(c.qty)||1),0);
 const realized=sold.reduce((a,c)=>a+(n(c.salePrice)*(1-n(S.settings.feePct)/100)-n(c.cost)),0);
 const cands=owned.filter(c=>{const g=gradeCall(c);return g&&g.verdict==="grade";});
 const upside=cands.reduce((a,c)=>a+gradeCall(c).net,0);
 const unpriced=owned.filter(c=>!n(c.vRaw)).length;
 return{owned,sold,value,cost,realized,cands,upside,unpriced};
}


/* ============ scan engine ============ */
function raced(promise,ms,label){
 return Promise.race([promise,
  new Promise((_,rej)=>setTimeout(()=>rej(new Error((label||"operation")+" timed out")),ms))]);
}
function withTimeout(ms){
 const ac=new AbortController();
 const t=setTimeout(()=>ac.abort(),ms);
 return {signal:ac.signal,done:()=>clearTimeout(t)};
}
async function edgeCall(name,payload,ms){
 if(!cfg)throw new Error("Not connected");
 const to=withTimeout(ms||140000);
 const token=authToken||cfg.key;
 let r;
 try{
  r=await fetch(cfg.url.replace(/\/+$/,"")+"/functions/v1/"+name,{
   method:"POST",
   headers:{"Content-Type":"application/json","Authorization":"Bearer "+token,"apikey":cfg.key},
   body:JSON.stringify(payload),signal:to.signal});
 }catch(err){to.done();
  if(err&&err.name==="AbortError")throw new Error("Timed out after "+Math.round((ms||140000)/1000)+"s");
  throw new Error("Blocked before reaching '"+name+"'. In Supabase → Edge Functions → "+name+" → Settings, turn OFF 'Verify JWT with legacy secret'.");}
 to.done();
 if(r.status===404)throw new Error("No '"+name+"' function deployed yet — add it in Supabase → Edge Functions");
 let j;
 try{j=await r.json();}catch(_){throw new Error("The "+name+" function returned something unreadable");}
 if(r.status===402){const e=new Error(j.error||"Out of credit");e.needsCredit=true;throw e;}
 if(!r.ok){const extra=j.got?(" — model said: "+String(j.got).slice(0,160)):"";
  throw new Error((j.error||(name+" failed, HTTP "+r.status))+extra);}
 return j;
}
async function scanAPI(b64){
 return edgeCall("scan",{image:b64,mediaType:"image/jpeg"},60000);
}
function enqueue(files){
 for(const f of files)queue.push({qid:"q"+Date.now()+Math.random().toString(36).slice(2,5),
  file:f,name:f.name,state:"waiting"});
 tab="scan";render();pump();
}
async function pump(){
 if(scanning)return;
 const it=queue.find(q=>q.state==="waiting");if(!it)return;
 scanning=true;it.state="reading";render();
 const guard=setTimeout(()=>{
  if(it.state==="reading"){it.state="failed";
   it.err="Stalled past 100s — check Setup → Diagnostics";
   clearInterval(window._tick);scanning=false;render();pump();}
 },100000);
 try{
  const shot=await compress(it.file);
  it.preview=shot;it.t0=Date.now();render();
  clearInterval(window._tick);
  window._tick=setInterval(()=>{
   const el=document.getElementById("elapsed");
   if(el&&it.t0)el.textContent=Math.round((Date.now()-it.t0)/1000)+"s";
  },1000);
  const r=await scanAPI(shot.split(",")[1]);
  tally("scan",r.usage);
  const c=blank(nextSku(true));
  Object.assign(c,{
   cat:CATS.indexOf(r.cat)>-1?r.cat:"Other",
   year:r.year||"",set:r.set||"",subject:r.subject||"",num:r.num||"",
   variant:r.variant||"",serial:r.serial||"",traits:r.traits||"",
   graded:!!r.graded,grader:r.grader||"PSA",grade:r.grade||"",cert:r.cert||"",
   notes:r.note||"",review:r.confidence!=="high"});
  S.cards.unshift(c);releaseSku(c.sku);save();
  it.state="done";it.cardId=c.id;it.conf=r.confidence;
  it.label=[r.year,r.set,r.subject].filter(Boolean).join(" ")||"Unidentified";
  clearInterval(window._tick);
  render();
  // storage and sync run in the background — a slow upload must never stall the queue
  const cid=c.id;
  const live=()=>S.cards.find(x=>x.id===cid)||c;
  raced(uploadPhoto(cid,"F",shot),45000,"photo upload")
   .then(u=>{const cur=live();cur.photoF=u;return raced(pushCard(cur),20000,"save");})
   .catch(()=>{setSync("photo failed");return raced(pushCard(live()),20000,"save").catch(()=>{});})
   .then(()=>render());
  if(c.subject||c.set)queueReprice([c]);
 }catch(e){if(it.state!=="failed"){it.state="failed";it.err=e.message||String(e);}}
 clearTimeout(guard);
 clearInterval(window._tick);
 if(scanning){scanning=false;render();pump();}
 // once nothing is waiting, tidy finished rows away and leave failures visible
 if(!queue.some(q=>q.state==="waiting"||q.state==="reading")){
  clearTimeout(window._qclear);
  window._qclear=setTimeout(()=>{
   if(queue.some(q=>q.state==="waiting"||q.state==="reading"))return;
   const failed=queue.filter(q=>q.state==="failed");
   if(failed.length!==queue.length){queue=failed;render();}
  },4000);
 }
}

/* ============ price refresh ============ */
function addedTime(c){
 if(!c)return 0;
 // Card ids embed their creation time: "c" or "i" + Date.now() + random.
 // This survives sync, needs no extra column, and works on every device.
 const m=String(c.id||"").match(/^[a-z](\d{13})/i);
 if(m)return parseInt(m[1],10);
 if(c.addedAt){const t=Date.parse(c.addedAt);if(!isNaN(t))return t;}
 if(c.pricedOn){const t=Date.parse(c.pricedOn);if(!isNaN(t))return t;}
 if(c.acqDate){const t=Date.parse(c.acqDate);if(!isNaN(t))return t;}
 return 0;
}
/* Claude Sonnet pricing, USD per million tokens, plus web search per call. */
const RATE={in:2/1e6, out:10/1e6, search:0.01};
function spend(u){return n(u.in)*RATE.in + n(u.out)*RATE.out + n(u.searches)*RATE.search;}
function tally(kind,u){
 if(!u)return;
 const t=S.settings.usage||{in:0,out:0,searches:0,scans:0,prices:0};
 t.in=n(t.in)+n(u.in); t.out=n(t.out)+n(u.out); t.searches=n(t.searches)+n(u.searches);
 if(kind==="scan")t.scans=n(t.scans)+1; else t.prices=n(t.prices)+1;
 if(kind==="direct")t.direct=n(t.direct)+1;
 S.settings.usage=t;
 save();
 clearTimeout(window._st);window._st=setTimeout(pushSettings,2000);
}
function money4(v){return S.settings.currency+(Math.round(v*100)/100).toFixed(2);}
function daysSince(d){
 if(!d)return 9999;
 const t=Date.parse(d);if(isNaN(t))return 9999;
 return Math.floor((Date.now()-t)/86400000);
}
function isStale(c){
 if(c.status==="sold")return false;
 if(!n(c.vRaw))return false;
 return daysSince(c.pricedOn)>n(S.settings.staleDays||90);
}
let rq=[], rDone=0, rFail=0, rThin=0;

async function repriceAPI(c){
 const card={year:c.year,set:c.set,subject:c.subject,num:c.num,variant:c.variant,
  serial:c.serial,cat:c.cat,graded:c.graded,grader:c.grader,grade:c.grade};
 return edgeCall("reprice",{card},140000);
}
function avgLookupCost(){
 const t=S.settings.usage;
 if(t&&n(t.prices)>=2)return spend(t)/n(t.prices);
 return 0.15;   // before there is history, assume the model path
}
function confirmSpend(count){
 if(count<5)return true;
 const each=avgLookupCost();
 const est=each*count;
 return window.confirm(
  "Refresh "+count+" card"+(count===1?"":"s")+"?\n\n"+
  "Roughly "+money4(est)+" at your measured average of "+money4(each)+" each.\n"+
  "Cards the free lookup can price cost nothing, so the real figure is usually lower.\n\n"+
  "This bills to your Anthropic account.");
}
function queueReprice(cards,includeVerified){
 const skipped=includeVerified?[]:cards.filter(c=>c.verified);
 const list=includeVerified?cards:cards.filter(c=>!c.verified);
 if(skipped.length)toast("Skipped "+skipped.length+" you have checked yourself");
 const ids=list.map(c=>c.id).filter(id=>rq.indexOf(id)===-1);
 if(!ids.length){toast("Nothing to refresh");return;}
 rq=rq.concat(ids);rDone=0;rFail=0;render();rpump();
}
/* Three cards at a time. Serial was safe but made 300 cards a two-hour job;
   three is comfortably inside the API's concurrency limits and cuts it to
   under an hour. Each worker re-resolves its card after the await, so a sync
   mid-flight still writes to the card on screen. */
const RLIMIT=3;
let rActive=0;

async function repriceOne(id){
 const c0=S.cards.find(x=>x.id===id);
 if(!c0)return;
 try{
  const r=await repriceAPI(c0);
  tally("price",r.usage);
  if(r.path==="direct")tally("direct",{in:0,out:0,searches:0});
  const c=S.cards.find(x=>x.id===id)||c0;
  const before=n(c.vRaw);
  const ev=r.evidence||null;
  const got=(b)=>ev&&ev[b]&&n(ev[b].median)>0;
  if(got("current"))c.vRaw=n(r.vRaw);
  if(!c.graded){
   if(got("psa9"))c.v9=n(r.v9);
   if(got("psa10"))c.v10=n(r.v10);
  }
  c.evidence=ev;
  c.pricePath=r.path||"model";
  c.directWhy=r.directWhy||"";
  if(r.source&&/^https?:/.test(String(r.source)))c.srcUrl=r.source;
  c.pricedOn=new Date().toISOString().slice(0,10);
  c.lastMove=before&&got("current")?Math.round(n(c.vRaw)-before):0;
  if(r.note)c.notes=r.note;
  // Flag only what a person actually needs to look at. Medium confidence is
  // the normal case; flagging it put a warning on 71% of the collection and
  // made the flag worthless.
  c.review=(r.confidence==="low")||(ev&&ev.current&&ev.current.method==="none");
  await pushCard(c);
  logPrice(c,r);
  rDone++;
  if(!n(r.totalComps))rThin++;
 }catch(e){
  rFail++;
  const msg=String(e&&e.message||e||"Refresh failed");
  if(e&&e.needsCredit){rq=[];toast(msg);loadAccount().then(render);}
  const card=S.cards.find(x=>x.id===id);
  if(card){
   card.evidence={error:msg,checkedOn:new Date().toISOString().slice(0,10)};
   card.pricedOn=new Date().toISOString().slice(0,10);
   save();pushCard(card);
  }
 }
}

function rpump(){
 while(rActive<RLIMIT&&rq.length){
  const id=rq.shift();
  rActive++;
  repriceOne(id).catch(()=>{}).then(()=>{
   rActive--;
   render();
   rpump();
  });
 }
 if(!rq.length&&rActive===0){
  if(rDone||rFail){
   toast(`Refreshed ${rDone}${rThin?", "+rThin+" with no sales found":""}${rFail?", "+rFail+" failed":""}`);
   rDone=0;rFail=0;rThin=0;
  }
  if(!scanning)setTimeout(()=>{if(!rq.length&&!rActive&&!scanning)pullAll().then(render);},1200);
  render();
 }
}
function repriceBanner(){
 if(!rq.length&&!rActive)return"";
 return`<div class="rbanner"><span class="pulse">Refreshing prices…</span>
  <span class="rcount">${rq.length+rActive} left</span>
  <button class="rstop" data-act="stopreprice">stop</button></div>`;
}

function tick(l,v,hot){return`<div class="tick${hot?" hot":""}"><div class="tick-v">${v}</div><div class="tick-l">${l}</div></div>`;}
function positionTabs(){const hd=document.querySelector(".hdr");const tb=document.querySelector(".tabs");
 if(hd&&tb)tb.style.top=hd.offsetHeight+"px";}

function viewCollection(){
 const wantSold=F.flags.indexOf("sold")>-1;
 const flagChecks=F.flags.filter(f=>f!=="sold");
 let list=S.cards.filter(c=>{
  if(!wantSold&&c.status==="sold")return false;
  if(F.cats.length&&F.cats.indexOf(c.cat)===-1)return false;
  if(F.minVal&&n(c.vRaw)<F.minVal)return false;
  if(F.traits.length){
   const tl=traitList(c);
   if(!F.traits.some(t=>tl.indexOf(t)>-1))return false;
  }
  if(flagChecks.length){
   const hit=flagChecks.some(f=>
    f==="raw"?!c.graded:
    f==="graded"?!!c.graded:
    f==="review"?!!c.review:
    f==="verified"?!!c.verified:
    f==="goats"?isGoat(c):
    f==="stale"?isStale(c):
    f==="unpriced"?!n(c.vRaw):false);
   if(!hit)return false;
  }
  if(!F.q)return true;
  return (c.subject+" "+c.set+" "+c.year+" "+c.num+" "+c.variant+" "+c.sku+" "+c.notes)
   .toLowerCase().includes(F.q.toLowerCase());
 });
 list.sort((a,b)=>
  F.sort==="newest"?addedTime(b)-addedTime(a):
  F.sort==="oldest"?addedTime(a)-addedTime(b):
  F.sort==="value"?n(b.vRaw)-n(a.vRaw):
  F.sort==="year"?n(b.year)-n(a.year):
  (a.subject||"").localeCompare(b.subject||""));
 const cats=["all",...new Set(S.cards.map(c=>c.cat))];
 window._visible=list;

 const FLAGS=[["goats","GOATs"],["raw","Raw"],["graded","Graded"],["verified","Checked by you"],
  ["unpriced","No price yet"],["stale","Stale prices"],["review","Needs review"],["sold","Sold"]];
 const SORTS=[["newest","Newest scan"],["oldest","Oldest scan"],["value","Value"],
  ["year","Year"],["name","Name A-Z"]];
 const catCounts={},traitCounts={};
 S.cards.forEach(c=>{
  if(c.status==="sold"&&!wantSold)return;
  catCounts[c.cat]=(catCounts[c.cat]||0)+1;
  traitList(c).forEach(t=>{traitCounts[t]=(traitCounts[t]||0)+1;});
 });
 const catKeys=Object.keys(catCounts).sort();
 const traitKeys=Object.keys(traitCounts).sort((a,b)=>traitCounts[b]-traitCounts[a]);
 const pill=(key,label,count)=>`<button class="fpill${F.open===key?" open":""}${count?" active":""}"
   data-panel="${key}">${label}${count?`<span class="fnum">${count}</span>`:""}
   <span class="fcar">${F.open===key?"\u25B4":"\u25BE"}</span></button>`;
 const box=(kind,val,label,on,count)=>`<button class="fopt${on?" on":""}"
   data-pick="${kind}" data-val="${esc(val)}">${label}${count?` <span class="foptn">${count}</span>`:""}</button>`;
 const anyFilter=F.cats.length||F.traits.length||F.flags.length||F.minVal;

 let h=`<div class="pane"><input class="search" id="q" placeholder="Search name, set, year, SKU" value="${esc(F.q)}">
  <div class="fbar">
   ${pill("cat","Category",F.cats.length)}
   ${traitKeys.length?pill("trait","Type",F.traits.length):""}
   ${pill("flag","Show",F.flags.length)}
   ${pill("val","Value",F.minVal?1:0)}
   ${pill("sort","Sort",0)}
  </div>
  ${F.open==="cat"?`<div class="fpanel">${catKeys.map(k=>
    box("cat",k,esc(k),F.cats.indexOf(k)>-1,catCounts[k])).join("")}</div>`:""}
  ${F.open==="trait"?`<div class="fpanel">${traitKeys.map(k=>
    box("trait",k,esc(TRAIT_LABEL[k]||k),F.traits.indexOf(k)>-1,traitCounts[k])).join("")}</div>`:""}
  ${F.open==="flag"?`<div class="fpanel">${FLAGS.map(([k,l])=>
    box("flag",k,l,F.flags.indexOf(k)>-1,0)).join("")}</div>`:""}
  ${F.open==="val"?`<div class="fpanel">${[[0,"Any value"],[10,"$10 and up"],[25,"$25 and up"],
    [50,"$50 and up"],[100,"$100 and up"],[250,"$250 and up"]].map(([v,l])=>
    box("val",String(v),l,F.minVal===v,0)).join("")}</div>`:""}
  ${F.open==="sort"?`<div class="fpanel">${SORTS.map(([k,l])=>
    box("sort",k,l,F.sort===k,0)).join("")}</div>`:""}
  ${anyFilter?`<div class="fclear"><button data-act="clearfilters">Clear all filters</button></div>`:""}
  <div class="count"><span>${list.length} item${list.length===1?"":"s"}</span>
   <span class="count-v">${money(list.reduce((a,c)=>a+n(c.vRaw)*(n(c.qty)||1),0))}</span></div>`;
 if(!list.length)h+=`<div class="empty">
  <p>${S.cards.length?"Nothing matches those filters.":"Nothing here yet. Scan something, or add it by hand."}</p>
  ${S.cards.length&&(F.cats.length||F.traits.length||F.flags.length)?`<button class="btn ghost" data-act="clearfilters">Clear filters</button>`:""}
  <button class="btn" data-act="new">Add a card by hand</button></div>`;
 else{h+=list.slice(0,F.limit).map(slabRow).join("");
  if(list.length>F.limit)h+=`<button class="btn ghost wide" data-act="more">Show 50 more (${list.length-F.limit} left)</button>`;}
 return h+"</div>";
}

function slabRow(c){
 const g=gradeCall(c), f=photoURL(c,"F");
 const cls=c.graded?"cg "+(n(c.grade)>=10?"g10":n(c.grade)>=9?"g9":"g8"):"cg raw";
 return`<article class="slab" data-open="${c.id}">
  <div class="${cls}">${c.graded?`<span class="cg-co">${esc(c.grader)}</span><span class="cg-n">${esc(c.grade)}</span>`:`<span class="cg-raw">RAW</span>`}</div>
  <div class="sb">
   <div class="sl"><span class="sl-yr">${esc(c.year||"—")}</span><span class="sl-set">${esc(c.set||"Unset")}</span></div>
   <h3 class="sn">${esc(c.subject||"Untitled card")}</h3>
   <div class="sm">${c.num?`<span>#${esc(c.num)}</span>`:""}${c.variant?`<span>${esc(c.variant)}</span>`:""}${c.serial?`<span>/${esc(c.serial)}</span>`:""}${n(c.qty)>1?`<span>×${esc(c.qty)}</span>`:""}</div>
   ${traitList(c).length?`<div class="trs">${traitList(c).slice(0,4).map(t=>
     `<span class="tr${t==="auto"||t==="relic"||t==="numbered"?" hot":""}">${esc(TRAIT_LABEL[t]||t)}</span>`).join("")}</div>`:""}
   <div class="sf"><span class="sku">${esc(c.sku)}</span><span class="val">${n(c.vRaw)?money(c.vRaw):"no price"}${
 c.evidence&&c.evidence.current?`<span class="val-n">${c.evidence.current.method==="sales"?" n="+c.evidence.current.n
 :c.evidence.current.method==="guide"?" guide"
 :c.evidence.current.method==="estimate"?" est":" no data"}</span>`:""}</span></div>
   ${c.verified?`<div class="flag ok">Checked by you</div>`:""}
   ${c.review?`<div class="flag warn">Check this one</div>`:""}
   ${g&&g.verdict==="grade"?`<div class="flag">Grade this — +${money(g.net)} expected</div>`:""}
   ${g&&g.verdict==="maybe"?`<div class="flag soft">Borderline grading call</div>`:""}
   ${g&&g.verdict==="nograded"?`<div class="flag stale">Missing PSA 9 / 10 comps</div>`:""}
   ${isStale(c)?`<div class="flag stale">Price is ${daysSince(c.pricedOn)} days old</div>`:""}
  </div>
  ${f?`<img class="thumb" src="${esc(f)}" alt="" loading="lazy" onerror="this.remove()">`
     :`<img class="thumb" data-lazy="${c.id}-F" alt="" onerror="this.remove()">`}
 </article>`;
}

function viewGrading(){
 const rows=S.cards.filter(c=>!c.graded&&c.status!=="sold").map(c=>({c,g:gradeCall(c)}))
   .filter(r=>r.g).sort((a,b)=>b.g.net-a.g.net);
 const G=v=>rows.filter(r=>r.g.verdict===v);
 let h=`<div class="pane"><div class="note">Each raw card is scored against your grading cost of ${money(S.settings.gradingCost)} and the odds you set on its condition. Both live in Setup.</div>`;
 h+=sec("Send these in",G("grade"))+sec("Borderline",G("maybe"))
  +sec("No PSA 9 / 10 comps yet — can't call it",G("nograded").slice(0,40))
  +sec("Need prices before I can call it",G("unpriced").slice(0,40));
 if(!rows.length)h+=`<div class="empty"><p>No raw cards yet. Add some and they'll be scored here.</p></div>`;
 return h+"</div>";
}
function sec(t,rows){
 if(!rows.length)return"";
 return`<div class="section"><div class="sec-hd"><h2>${t}</h2><span>${rows.length}</span></div>${rows.map(growRow).join("")}</div>`;
}
function growRow({c,g}){
 const raw=n(c.vRaw),v9=n(c.v9),v10=n(c.v10),max=Math.max(raw,v9,v10,1);
 return`<div class="grow" data-open="${c.id}">
  <div class="grow-hd"><span class="grow-t">${esc([c.year,c.set,c.subject,c.num?"#"+c.num:""].filter(Boolean).join(" "))}</span>
  ${g.verdict!=="unpriced"?`<span class="grow-net${g.net>0?" pos":""}">${g.net>0?"+":""}${money(g.net)}</span>`:""}</div>
  ${g.verdict==="unpriced"?`<div class="grow-empty">No prices yet. Refresh this card or fill them in.</div>`:
   g.verdict==="nograded"?`<div class="grow-empty">Priced raw at ${money(c.vRaw)}, but no PSA 9 / 10 sales found — so there's no honest grading call to make. Tap Refresh price, or enter them yourself.</div>`:
   `<div class="bars">${bar("raw",raw,max,"b-raw")}${bar("psa 9",v9,max,"b-9")}${bar("psa 10",v10,max,"b-10")}</div>`}
 </div>`;
}
function bar(l,v,max,cls){return`<div class="bar"><span class="bar-l">${l}</span>
 <div class="bar-tr"><div class="bar-f ${cls}" style="width:${Math.max(2,(v/max)*100)}%"></div></div>
 <span class="bar-v">${money(v)}</span></div>`;}

function viewMoney(st){
 const m={};st.owned.forEach(c=>{m[c.cat]=m[c.cat]||{n:0,v:0,c:0};
  m[c.cat].n+=n(c.qty)||1;m[c.cat].v+=n(c.vRaw)*(n(c.qty)||1);m[c.cat].c+=n(c.cost)*(n(c.qty)||1);});
 const byCat=Object.entries(m).sort((a,b)=>b[1].v-a[1].v);
 const pl=st.value-st.cost;
 let h=`<div class="pane"><div class="bigstat"><div class="bs-l">Portfolio value</div>
  <div class="bs-v">${money(st.value)}</div>
  <div class="bs-d ${pl>=0?"pos":"neg"}">${pl>=0?"▲":"▼"} ${money(Math.abs(pl))} against ${money(st.cost)} in</div></div>
  <div class="grid2">
   <div class="stat"><div class="st-l">Realized profit</div><div class="st-v">${money(st.realized)}</div><div class="st-s">${st.sold.length} sold, ${esc(S.settings.feePct)}% fees</div></div>
   <div class="stat"><div class="st-l">Grading upside</div><div class="st-v">${money(st.upside)}</div><div class="st-s">${st.cands.length} candidates</div></div></div>`;
 h+=`<div class="section"><div class="sec-hd"><h2>By category</h2><span>${byCat.length}</span></div>
  <table class="tbl"><thead><tr><th>Category</th><th>Items</th><th>Cost</th><th>Value</th></tr></thead><tbody>
  ${byCat.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.n}</td><td>${money(v.c)}</td><td class="strong">${money(v.v)}</td></tr>`).join("")}
  </tbody></table></div>`;

 h+=(()=>{
  const val=c=>n(c.vRaw)*(n(c.qty)||1);
  const groups={"Single cards":[],"Sealed product":[],"Funko Pops":[]};
  st.owned.forEach(c=>{
   const k=c.cat==="Sealed product"?"Sealed product":c.cat==="Funko Pop"?"Funko Pops":"Single cards";
   groups[k].push(c);
  });
  const rows=Object.entries(groups).filter(([,l])=>l.length);
  if(rows.length<2)return"";
  return `<div class="section"><div class="sec-hd"><h2>By format</h2></div>
   <table class="tbl"><thead><tr><th>Format</th><th>Items</th><th>Value</th><th>Average</th></tr></thead><tbody>
   ${rows.map(([k,l])=>{const v=l.reduce((a,c)=>a+val(c),0);
    return `<tr><td>${k}</td><td>${l.length}</td><td class="strong">${money(v)}</td>
     <td>${money(v/l.length)}</td></tr>`;}).join("")}
   </tbody></table>
   <p class="note">Grading applies to single cards only — sealed product and figures are left out of the Grading tab.</p></div>`;
 })();

 if(st.unpriced)h+=`<div class="warn">${st.unpriced} items have no price yet — portfolio value is understated until you fill them in.</div>`;
 h+=(()=>{
  const priced=st.owned.filter(c=>n(c.vRaw)>0).sort((a,b)=>n(b.vRaw)-n(a.vRaw));
  if(priced.length<5)return"";
  const total=st.value||1;
  const top10=priced.slice(0,10);
  const share=Math.round(top10.reduce((a,c)=>a+n(c.vRaw)*(n(c.qty)||1),0)/total*100);
  const avg=Math.round(total/(st.owned.length||1));
  const vals=priced.map(c=>n(c.vRaw)).sort((a,b)=>a-b);
  const med=Math.round(vals.length%2?vals[(vals.length-1)/2]:(vals[vals.length/2-1]+vals[vals.length/2])/2);
  return `<div class="section">
   <div class="sec-hd"><h2>Sanity check</h2><span>${share}% in top 10</span></div>
   <p class="note">Average ${money(avg)} an item, median ${money(med)}. When the median sits far
   below the average, a handful of big numbers are carrying the total — worth checking those are real.</p>
   <table class="tbl"><thead><tr><th>Card</th><th>Value</th><th>Priced by</th></tr></thead><tbody>
   ${top10.map(c=>`<tr><td>${esc([c.year,c.subject].filter(Boolean).join(" ")||c.sku)}</td>
    <td class="strong">${money(c.vRaw)}</td>
    <td>${c.pricePath==="direct"?"guide":(c.evidence&&c.evidence.current&&c.evidence.current.method==="estimate")?"estimate":"model"}</td></tr>`).join("")}
   </tbody></table></div>`;})();

 const ev={verified:{n:0,v:0},sales:{n:0,v:0},guide:{n:0,v:0},estimate:{n:0,v:0},none:{n:0,v:0}};
 st.owned.forEach(c=>{
  const meth=c.verified?"verified":((c.evidence&&c.evidence.current&&c.evidence.current.method)||"none");
  const k=ev[meth]?meth:"none";
  ev[k].n++; ev[k].v+=n(c.vRaw)*(n(c.qty)||1);
 });
 const evTotal=st.value||1;
 const soft=Math.round((ev.estimate.v+ev.none.v)/evTotal*100);
 h+=`<div class="section"><div class="sec-hd"><h2>How solid is this</h2><span>${soft}% soft</span></div>
  <table class="tbl"><thead><tr><th>Basis</th><th>Cards</th><th>Value</th><th>Share</th></tr></thead><tbody>
  ${[["verified","Checked by you"],["sales","Observed sales"],["guide","Market guide"],["estimate","Estimated"],["none","No evidence"]]
   .map(([k,l])=>`<tr><td>${l}</td><td>${ev[k].n}</td>
    <td class="${(k==="sales"||k==="verified")?"strong":""}">${money(ev[k].v)}</td>
    <td>${Math.round(ev[k].v/evTotal*100)}%</td></tr>`).join("")}
  </tbody></table>
  ${soft>=40?`<div class="warn">${soft}% of this total rests on estimates rather than observed sales or a market guide. Estimates run high on star players and premium products. Verify the largest before treating the total as real.</div>`:""}
 </div>`;
 // ---- shape of the collection ----
 const owned=st.owned;
 const val=c=>n(c.vRaw)*(n(c.qty)||1);
 const sum=list=>list.reduce((a,c)=>a+val(c),0);
 const graded=owned.filter(c=>c.graded), raw=owned.filter(c=>!c.graded);
 const sorted=owned.slice().sort((a,b)=>val(b)-val(a));
 const top10=sorted.slice(0,10);
 const vals=owned.map(val).filter(v=>v>0).sort((a,b)=>a-b);
 const med=vals.length?(vals.length%2?vals[(vals.length-1)/2]
   :(vals[vals.length/2-1]+vals[vals.length/2])/2):0;
 const bands=[["Under $5",0,5],["$5 to $25",5,25],["$25 to $100",25,100],
   ["$100 to $500",100,500],["$500 and up",500,Infinity]];
 const byGrader={};
 graded.forEach(c=>{const g=String(c.grader||"?").toUpperCase();
  byGrader[g]=byGrader[g]||{n:0,v:0}; byGrader[g].n++; byGrader[g].v+=val(c);});
 const traitStat={};
 ["numbered","auto","relic","rookie"].forEach(t=>{
  const list=owned.filter(c=>traitList(c).indexOf(t)>-1);
  if(list.length)traitStat[t]={n:list.length,v:sum(list)};
 });
 const stale=owned.filter(isStale).length;
 const needsReview=owned.filter(c=>c.review).length;
 const noPrice=owned.filter(c=>!n(c.vRaw)).length;

 h+=`<div class="section"><div class="sec-hd"><h2>Graded vs raw</h2></div>
  <table class="tbl"><thead><tr><th></th><th>Cards</th><th>Value</th><th>Average</th></tr></thead><tbody>
   <tr><td>Graded</td><td>${graded.length}</td><td class="strong">${money(sum(graded))}</td>
    <td>${money(graded.length?sum(graded)/graded.length:0)}</td></tr>
   <tr><td>Raw</td><td>${raw.length}</td><td class="strong">${money(sum(raw))}</td>
    <td>${money(raw.length?sum(raw)/raw.length:0)}</td></tr>
  </tbody></table></div>

  ${Object.keys(byGrader).length?`<div class="section"><div class="sec-hd"><h2>By grader</h2><span>${graded.length}</span></div>
  <table class="tbl"><thead><tr><th>Grader</th><th>Slabs</th><th>Value</th></tr></thead><tbody>
   ${Object.entries(byGrader).sort((a,b)=>b[1].v-a[1].v).map(([g,d])=>
    `<tr><td>${esc(g)}</td><td>${d.n}</td><td class="strong">${money(d.v)}</td></tr>`).join("")}
  </tbody></table></div>`:""}

  <div class="section"><div class="sec-hd"><h2>Where the value sits</h2></div>
  <table class="tbl"><thead><tr><th>Band</th><th>Cards</th><th>Value</th><th>Share</th></tr></thead><tbody>
   ${bands.map(([l,lo,hi])=>{const list=owned.filter(c=>val(c)>=lo&&val(c)<hi);
    return list.length?`<tr><td>${l}</td><td>${list.length}</td><td>${money(sum(list))}</td>
     <td>${Math.round(sum(list)/(st.value||1)*100)}%</td></tr>`:"";}).join("")}
  </tbody></table>
  <p class="note">Top 10 items hold ${money(sum(top10))} — ${Math.round(sum(top10)/(st.value||1)*100)}% of everything.
   Median item is ${money(med)}, average ${money(owned.length?st.value/owned.length:0)}.</p></div>

  ${Object.keys(traitStat).length?`<div class="section"><div class="sec-hd"><h2>By type</h2></div>
  <table class="tbl"><thead><tr><th>Type</th><th>Cards</th><th>Value</th><th>Average</th></tr></thead><tbody>
   ${Object.entries(traitStat).sort((a,b)=>b[1].v-a[1].v).map(([t,d])=>
    `<tr><td>${esc(TRAIT_LABEL[t]||t)}</td><td>${d.n}</td><td>${money(d.v)}</td>
     <td>${money(d.v/d.n)}</td></tr>`).join("")}
  </tbody></table></div>`:""}

  ${(stale||needsReview||noPrice)?`<div class="section"><div class="sec-hd"><h2>Needs attention</h2></div>
  <table class="tbl"><tbody>
   ${noPrice?`<tr><td>No price yet</td><td>${noPrice}</td></tr>`:""}
   ${needsReview?`<tr><td>Flagged for review</td><td>${needsReview}</td></tr>`:""}
   ${(()=>{const g=owned.filter(c=>c.graded&&
     (!c.grader||["OTHER","?",""].indexOf(String(c.grader).toUpperCase())>-1));
    return g.length?`<tr><td>Graded but grader not read</td><td>${g.length}</td></tr>`:"";})()}
   ${(()=>{const g=owned.filter(c=>c.graded&&!c.grade);
    return g.length?`<tr><td>Graded but no grade recorded</td><td>${g.length}</td></tr>`:"";})()}
   ${stale?`<tr><td>Price older than ${esc(S.settings.staleDays)} days</td><td>${stale}</td></tr>`:""}
  </tbody></table></div>`:""}

`;
 if(st.sold.length)h+=`<div class="section"><div class="sec-hd"><h2>Sold</h2><span>${st.sold.length}</span></div>
  <table class="tbl"><thead><tr><th>Card</th><th>Sold</th><th>Net</th></tr></thead><tbody>
  ${st.sold.map(c=>{const net=n(c.salePrice)*(1-n(S.settings.feePct)/100)-n(c.cost);
   return`<tr><td>${esc(c.subject)} ${esc(c.year)}</td><td>${money(c.salePrice)}</td><td class="${net>=0?"pos":"neg"}">${money(net)}</td></tr>`;}).join("")}
  </tbody></table></div>`;
 return h+"</div>";
}

function viewSetup(){

 /* ---------- collection identity ---------- */

   <table class="tbl"><tbody>

 }

 /* ---------- prices, including the bulk refresh ---------- */

  ${fld("Selling fees %","feePct",S.settings.feePct,"","set","number")}

 /* ---------- data ---------- */

  <button class="btn ghost wide" data-act="imp">Import a CSV</button>

 /* ---------- tidying ---------- */
 const dupes=findDupes().length, skuDupes=findSkuDupes().length;
 const unsaved=Object.keys(pending).length;

 ].filter(Boolean);
 const tidyCount=(unsaved?1:0)+(dupes?1:0)+(skuDupes?1:0)+(flags?1:0);
 const tidy=tidyBits.length?tidyBits.join(""):`<p class="note">Nothing needs tidying.</p>`;

  <button class="btn ghost wide" data-act="pricetest">Test a price lookup</button>

  <button class="btn ghost wide" data-act="hardrefresh">Clear cache and reload</button>`;

 /* ---------- account ---------- */
 const account=`
  <p class="note">Signed in as <b>${esc(user?user.email:"")}</b>. Everything syncs, so any device you sign in from shows the same collection.</p>
  <button class="btn ghost wide" data-act="pull">Refresh from the database</button>

  <button class="btn ghost wide" data-act="signout">Sign out</button>
  <p class="note">On iPhone, add to your home screen with Share → Add to Home Screen. On Android, Chrome offers to install it.</p>`;

 return `<div class="pane setup">
  ${sec("Collection","",collection,true)}
  ${sec("GOATs",goatNames().length,goats)}
  ${sec("Credit","",credit)}
  ${sec("Prices",staleList.length+unpriced.length||"",prices)}

  ${sec("Import and export","",data)}
  ${sec("Tidying up",tidyCount||"",tidy)}

  ${sec("Account","",account)}

}

function bucketRow(label,b){
 if(!b||!n(b.median))return`<tr><td>${label}</td><td colspan="3" class="ev-none">nothing found</td></tr>`;
 const basis=b.method==="sales"
  ? (b.n===1?"1 sale":b.n+" sales")
  : b.method==="guide"
   ? `<span class="ev-guide">${esc((b.guides&&b.guides[0]&&b.guides[0].source)||"market guide")}</span>`
   : `<span class="ev-est">estimate</span>`;
 return`<tr><td>${label}</td>
  <td class="ev-med${b.method==="estimate"?" ev-soft":""}">${money(b.median)}</td>
  <td>${basis}</td>
  <td>${b.low===b.high?"":money(b.low)+"–"+money(b.high)}</td></tr>`;
}
function lookupLinks(c){
 const q=[c.year,c.set,c.subject,c.num?"#"+c.num:"",c.variant].filter(Boolean).join(" ");
 if(!q.trim())return"";
 const e=encodeURIComponent(q);
 // matches the pricing function: sports go to SportsCardsPro, everything else to PriceCharting
 const tcg=["NBA","WNBA","NFL","MLB","NHL","Soccer","Boxing/MMA"].indexOf(c.cat)===-1;
 const links=[
  ["eBay sold","https://www.ebay.com/sch/i.html?_nkw="+e+"&LH_Sold=1&LH_Complete=1"],
  [tcg?"PriceCharting":"SportsCardsPro",
   tcg?"https://www.pricecharting.com/search-products?type=prices&q="+e
      :"https://www.sportscardspro.com/search-products?q="+e],
  ["PSA prices","https://www.psacard.com/auctionprices"],
  ...(c.graded&&c.cert&&String(c.grader).toUpperCase()==="PSA"
   ?[["Verify cert","https://www.psacard.com/cert/"+encodeURIComponent(String(c.cert).replace(/\D/g,""))]]:[]),
  ["Google","https://www.google.com/search?q="+e],
 ];
 return`<div class="lookup">
  <div class="lookup-hd">Check it yourself</div>
  <div class="lookup-row">${links.map(([t,u])=>
   `<a class="lookup-a" href="${u}" target="_blank" rel="noopener">${t}</a>`).join("")}</div>
  <p class="lookup-q">Searching: <code>${esc(q)}</code></p>
 </div>`;
}
function evidencePanel(c){
 const ev=c.evidence;
 if(ev&&ev.error)return`<div class="ev"><div class="ev-hd">Pricing failed<span class="ev-when">${esc(ev.checkedOn||"")}</span></div>
  <div class="ev-warn">${esc(ev.error)}</div>
  <p class="note" style="margin:8px 0 0">Try the button above again, or use the lookup links below to price it by hand.</p></div>`;
 if(!ev)return`<div class="ev ev-empty">No pricing evidence yet. Tap the button above and it will record the individual sales it finds.</div>`;
 const list=[];
 ["current","psa9","psa10"].forEach(k=>{
  const b=ev[k];if(!b||!b.comps)return;
  b.comps.forEach(s=>list.push({b:k,...s}));
 });
 const lbl={current:"as-is",psa9:"PSA 9",psa10:"PSA 10"};
 return`<div class="ev">
  <div class="ev-hd">What this price is based on
   <span class="ev-when">${esc(ev.checkedOn||"")}</span></div>
  ${(()=>{const t=c.evidence&&c.evidence.tiers;
   if(!c.graded||!t||!n(t.ungraded))return"";
   const slab=n(c.vRaw), raw=n(t.ungraded);
   if(!slab)return"";
   if(raw>=slab)return `<div class="ev-crack warn">The raw copy trades at ${money(raw)} — at or above this slab. The grade is adding nothing.</div>`;
   return `<div class="ev-crack">Raw copies trade at ${money(raw)}, so the grade is worth about ${money(slab-raw)}.</div>`;})()}
  ${c.srcUrl&&c.pricePath==="direct"?`<a class="ev-src" href="${esc(c.srcUrl)}" target="_blank" rel="noopener">see the page this came from</a>`:""}
  ${c.pricePath?`<div class="ev-path ${c.pricePath==="direct"?"free":""}">${
   c.pricePath==="direct"?"read straight from the guide — free"
   :c.pricePath==="direct+model"?"guide page plus a model lookup"
   :"model lookup with web search"}${
   c.directWhy?` · free lookup missed: ${esc(c.directWhy)}`:""}</div>`:""}
  <table class="ev-tbl"><tbody>
   ${bucketRow("As it is now",ev.current)}
  ${(()=>{const t=ev.tiers;if(!t)return"";
   const rows=[["Raw / ungraded",t.ungraded],["Grade 7",t.g7],["Grade 8",t.g8],
    ["Grade 9",t.g9],["Grade 9.5",t.g95],["PSA 10",t.psa10],["BGS 10",t.bgs10],
    ["CGC 10",t.cgc10],["SGC 10",t.sgc10]]
    .filter(([,v])=>n(v)>0);
   return rows.length?rows.map(([l,v])=>
    `<tr><td>${l}</td><td class="ev-med">${money(v)}</td><td colspan="2" class="ev-tier">published tier</td></tr>`).join(""):"";})()}
   ${c.graded?"":bucketRow("If PSA 9",ev.psa9)}
   ${c.graded?"":bucketRow("If PSA 10",ev.psa10)}
  </tbody></table>
  ${list.length?`<div class="ev-sub">Sales found</div>
   <ul class="ev-list">${list.slice(0,12).map(s=>
    `<li><span class="ev-p">${money(s.price)}</span>
     <span class="ev-b">${lbl[s.b]||s.b}</span>
     <span class="ev-d">${esc(s.date||"undated")}</span>
     <span class="ev-s">${esc(s.source||"")}</span></li>`).join("")}</ul>`
   :(ev.current&&ev.current.method==="estimate")
    ?`<div class="ev-est-box"><b>Estimated, not observed.</b> ${esc(ev.current.basis||"No sales or guide value was found, so this is reasoned from comparable cards.")}${
      ev.current.low!==ev.current.high?` Likely range ${money(ev.current.low)}–${money(ev.current.high)}.`:""}</div>`
   :(ev.current&&ev.current.method==="guide")
    ?`<div class="ev-note">No individual sales were visible, so these come from a market guide that aggregates eBay sales. Reasonable for sorting, worth verifying before you list anything above $100.</div>`
    :`<div class="ev-warn">Nothing found for this card. Any figure above is a placeholder, not a valuation — search it yourself before pricing.</div>`}
 </div>`;
}
function fld(label,k,v,ph,kind,type){
 kind=kind||"f";
 if(type==="area")return`<label class="fld"><span class="fld-l">${label}</span>
  <textarea class="fld-i" rows="2" data-${kind}="${k}" placeholder="${esc(ph||"")}">${esc(v)}</textarea></label>`;
 return`<label class="fld"><span class="fld-l">${label}</span>
  <input class="fld-i" type="${type||"text"}" ${type==="number"?'inputmode="decimal"':""} data-${kind}="${k}"
   value="${esc(v)}" placeholder="${esc(ph||"")}"></label>`;
}
function sel(label,k,v,opts){
 return`<label class="fld"><span class="fld-l">${label}</span><select class="fld-i" data-f="${k}">
  ${opts.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];
   return`<option value="${esc(val)}"${v===val?" selected":""}>${esc(lab)}</option>`;}).join("")}
 </select></label>`;
}

async function hydratePhotos(){
 for(const w of["F","B"]){
  const el=document.getElementById("img"+w);if(!el)continue;

  if(d){el.src=d;el.style.display="block";
   const x=document.querySelector(`[data-clear="${w}"]`);if(x&&!url)x.style.display="block";

}
